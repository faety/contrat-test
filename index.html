<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boyia Institute — Cours en ligne &amp; communauté</title>
<meta name="description" content="Apprends des compétences pratiques, paie par mobile money, échange avec la communauté.">
<style>
:root{
  --ground:#F4F6FB; --surface:#FFFFFF; --surface-2:#E9EEF8;
  --ink:#1E2A4A; --muted:#5C688A; --line:#DBE2F0;
  --primary:#3D63AE; --primary-deep:#2C4B8C; --primary-soft:#E4EBF8;
  --accent:#DA9A28; --accent-soft:#FAEED2;
  --danger:#C24C3B; --ok:#2E7D57;
  --shadow:0 1px 2px rgba(30,42,74,.07),0 6px 18px rgba(30,42,74,.09);
  --r:16px; --r-sm:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0F1524; --surface:#18213A; --surface-2:#212C4A;
    --ink:#EDF1FB; --muted:#93A1C4; --line:#2A3757;
    --primary:#6E93D6; --primary-deep:#5B84C4; --primary-soft:#1E2A48;
    --accent:#EBB44E; --accent-soft:#33291A;
    --danger:#E0705E; --ok:#4FB488;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1524; --surface:#18213A; --surface-2:#212C4A;
  --ink:#EDF1FB; --muted:#93A1C4; --line:#2A3757;
  --primary:#6E93D6; --primary-deep:#5B84C4; --primary-soft:#1E2A48;
  --accent:#EBB44E; --accent-soft:#33291A;
  --danger:#E0705E; --ok:#4FB488;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --ground:#F4F6FB; --surface:#FFFFFF; --surface-2:#E9EEF8;
  --ink:#1E2A4A; --muted:#5C688A; --line:#DBE2F0;
  --primary:#3D63AE; --primary-deep:#2C4B8C; --primary-soft:#E4EBF8;
  --accent:#DA9A28; --accent-soft:#FAEED2;
  --danger:#C24C3B; --ok:#2E7D57;
  --shadow:0 1px 2px rgba(30,42,74,.07),0 6px 18px rgba(30,42,74,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--ground); color:var(--ink);
  min-height:100dvh; line-height:1.5; font-size:16px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---- App shell ---- */
#shell{max-width:448px;margin:0 auto;min-height:100dvh;position:relative;background:var(--ground);display:flex;flex-direction:column}
@media (min-width:520px){
  body{background:color-mix(in srgb,var(--ground) 60%, var(--surface-2))}
  #shell{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
}
#main{flex:1;padding-bottom:84px}
.screen{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- Bottom nav ---- */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:448px;
  background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;color:var(--muted);font-size:11.5px;font-weight:600;min-height:56px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--primary)}
.tab .dot{position:absolute;display:none}

/* ---- Headers ---- */
.apphead{display:flex;align-items:center;gap:12px;padding:18px 18px 6px}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--primary)}
.logo{display:flex;align-items:center;gap:11px}
.logomark{width:42px;height:44px;flex:none}
.logomark text{font-family:var(--serif);font-weight:700;fill:#fff}
.logo .wm{font-family:var(--serif);line-height:1.02}
.logo .wm b{display:block;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.logo .wm span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--primary);margin-top:3px;font-family:var(--sans)}
.subhead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;position:sticky;top:0;background:var(--ground);z-index:20}
.subhead h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.tagline{color:var(--muted);font-size:14px;padding:0 18px 4px}

/* ---- Common ---- */
.px{padding-left:14px;padding-right:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--primary);color:#fff;font-weight:700;font-size:16px;
  padding:15px 18px;border-radius:14px;transition:transform .06s ease;
}
:root[data-theme="dark"] .btn{color:#0E1512}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0E1512} }
.btn:active{transform:scale(.98)}
.btn svg{width:19px;height:19px;flex:none}
.btn.ghost{background:var(--primary-soft);color:var(--primary-deep);border:1.5px solid var(--primary)}
.btn.soft{background:color-mix(in srgb,var(--primary) 14%,var(--surface));color:var(--primary-deep);border:1.5px solid color-mix(in srgb,var(--primary) 34%,transparent);font-weight:700}
.btn.soft[disabled]{opacity:.6}
.btn[disabled]{opacity:.45;pointer-events:none}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.free{background:var(--primary-soft);color:var(--primary)}
.pill.paid{background:var(--accent-soft);color:#9A6A0E}
:root[data-theme="dark"] .pill.paid{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pill.paid{color:var(--accent)} }
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);border:0}

/* ---- Search ---- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 14px 0}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{border:0;background:none;flex:1;font-size:15.5px;min-width:0}
.search input:focus{outline:none}
.search input::placeholder{color:var(--muted)}

/* ---- Course cards ---- */
.courselist{display:flex;flex-direction:column;gap:14px;padding:12px 14px 24px}
.ccard{display:block;text-align:left;overflow:hidden;border-radius:var(--r)}
.cover{height:118px;position:relative;display:flex;align-items:flex-end;padding:12px}
.cover .init{
  position:absolute;top:10px;right:14px;font-family:var(--serif);font-weight:700;
  font-size:64px;line-height:1;color:rgba(255,255,255,.28);user-select:none;
}
.cover .pill{background:rgba(255,255,255,.92);color:#201D19}
.cbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:6px}
.ctitle{font-size:16.5px;font-weight:700;line-height:1.3;text-wrap:balance}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--muted)}
.cmeta .star{color:var(--accent);display:inline-flex;align-items:center;gap:3px;font-weight:700}
.cmeta svg{width:13px;height:13px}
.cprice{font-weight:800;font-size:15px}
.cprice.free{color:var(--primary)}

/* ---- Course detail ---- */
.hero{height:170px;display:flex;align-items:flex-end;padding:16px;position:relative}
.hero .init{position:absolute;top:16px;right:20px;font-family:var(--serif);font-weight:700;font-size:96px;line-height:1;color:rgba(255,255,255,.25)}
.dtitle{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.22;text-wrap:balance;padding:16px 18px 4px}
.instr{display:flex;align-items:center;gap:10px;padding:8px 18px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.statrow{display:flex;gap:8px;padding:12px 14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:15px}
.stat span{font-size:11.5px;color:var(--muted)}
.sect{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 18px 8px}
.learnlist{display:flex;flex-direction:column;gap:9px;padding:0 18px}
.learnlist li{display:flex;gap:10px;list-style:none;font-size:14.5px}
.learnlist svg{width:18px;height:18px;color:var(--primary);flex:none;margin-top:2px}
.modules{display:flex;flex-direction:column;gap:10px;padding:4px 14px 20px}
.module{overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 15px;font-weight:700;font-size:14.5px}
.mhead .n{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);flex:none}
.lesson{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:14.5px}
.lesson svg{width:19px;height:19px;color:var(--muted);flex:none}
.lesson.done svg{color:var(--primary)}
.lesson .dur{margin-left:auto;font-size:12.5px;color:var(--muted)}
.ctabar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:448px;z-index:41;
  background:var(--surface);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px;
}
.ctabar .p{flex:none}
.ctabar .p b{font-size:19px}
.ctabar .p span{display:block;font-size:12px;color:var(--muted)}

/* ---- Overlay flows (Tally / paiement) ---- */
.flow{
  position:fixed;inset:0;z-index:60;background:var(--ground);
  display:flex;flex-direction:column;max-width:448px;margin:0 auto;
  animation:slideUp .26s cubic-bezier(.32,.72,.35,1);
}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.progress{height:4px;background:var(--surface-2)}
.progress i{display:block;height:100%;background:var(--primary);border-radius:0 2px 2px 0;transition:width .3s ease}
.flowhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.flowbody{flex:1;overflow-y:auto;padding:8px 22px 20px;display:flex;flex-direction:column}
.flowbody.center{justify-content:center}
.qnum{color:var(--primary);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.qnum svg{width:15px;height:15px}
.qlabel{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.25;text-wrap:balance}
.qhelp{color:var(--muted);font-size:14.5px;margin-top:8px}
.qinput{
  margin-top:22px;width:100%;border:0;border-bottom:2px solid var(--line);background:none;
  font-size:24px;padding:6px 2px 10px;border-radius:0;
}
.qinput:focus{outline:none;border-bottom-color:var(--primary)}
.qinput::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.phonerow{display:flex;gap:10px;margin-top:22px;align-items:flex-end}
.phonerow select{
  border:0;border-bottom:2px solid var(--line);background:none;font-size:20px;padding:6px 0 10px;max-width:118px;border-radius:0;
}
.phonerow input{margin-top:0;flex:1}
.qerr{color:var(--danger);font-size:14px;margin-top:10px;min-height:21px}
.flowfoot{padding:10px 22px calc(16px + env(safe-area-inset-bottom))}
.okrow{display:flex;align-items:center;gap:12px}
.okrow .hint{font-size:12.5px;color:var(--muted)}
.recap{margin-top:20px;display:flex;flex-direction:column}
.recap .row{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px}
.recap .row span{color:var(--muted)}
.recap .row b{text-align:right;word-break:break-word}

/* ---- Paiement ---- */
.ops{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.op{display:flex;align-items:center;gap:13px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.op.on{border-color:var(--primary);background:var(--primary-soft)}
.oplogo{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.op b{display:block;font-size:15px}
.op span{font-size:12.5px;color:var(--muted)}
.op .radio{margin-left:auto;width:21px;height:21px;border-radius:50%;border:2px solid var(--line);flex:none}
.op.on .radio{border-color:var(--primary);background:radial-gradient(circle,var(--primary) 45%,transparent 48%)}
.op.soon{opacity:.45}
.op.soon .radio{visibility:hidden}
.coupon{display:flex;gap:8px;margin-top:18px}
.coupon input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.coupon input::placeholder{text-transform:none;letter-spacing:normal;color:var(--muted)}
/* ---- Admin ---- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.k-val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.k-lab{font-size:12px;color:var(--muted)}
.adminwrap{padding:4px 14px 24px;display:flex;flex-direction:column;gap:12px}
.admtools{display:flex;flex-direction:column;gap:9px}
.admsearch{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px}
.admsearch:focus{outline:none;border-color:var(--primary)}
.chip.sm{padding:7px 12px;font-size:12.5px}
.admpad{padding:16px;text-align:center;color:var(--muted);font-size:14px}
.cpn{display:flex;align-items:center;gap:10px;padding:13px 14px}
.cpn .c-code{font-weight:800;font-size:15px;letter-spacing:.04em}
.cpn .c-sum{font-size:12.5px;color:var(--muted)}
.cpn .c-uses{font-size:11.5px;color:var(--muted)}
.cpn .grow{flex:1;min-width:0}
.tgl{width:44px;height:26px;border-radius:999px;background:var(--surface-2);position:relative;flex:none;border:1px solid var(--line)}
.tgl.on{background:var(--primary);border-color:var(--primary)}
.tgl i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s ease}
.tgl.on i{transform:translateX(18px)}
.cpn .del{color:var(--danger);width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cpn .del svg{width:17px;height:17px}
.afield{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.afield input,.afield select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);width:100%;min-width:0}
.arow{display:flex;gap:8px}
.arow .afield{flex:1;min-width:0}
.paywait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:20px 0}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ussd{font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:10px;padding:8px 14px;font-weight:700;letter-spacing:.04em}
.bigcheck{width:76px;height:76px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto}
.bigcheck svg{width:38px;height:38px}
.receipt{margin-top:22px}
.receipt .row{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px dashed var(--line);font-size:14px}
.receipt .row:last-child{border-bottom:0}
.receipt .row span{color:var(--muted)}
.demonote{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px;padding:0 10px}

/* ---- Communauté ---- */
.compose{display:flex;gap:11px;margin:10px 14px 0;padding:13px}
.compose .fake{flex:1;display:flex;align-items:center;color:var(--muted);font-size:14.5px;background:var(--surface-2);border-radius:999px;padding:0 16px;min-height:40px}
.feed{display:flex;flex-direction:column;gap:12px;padding:12px 14px 24px}
.post{padding:14px 15px}
.phead{display:flex;align-items:center;gap:10px}
.phead .who b{display:block;font-size:14.5px}
.phead .who span{font-size:12px;color:var(--muted)}
.pcat{margin-left:auto;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:999px;flex:none}
.ptext{margin-top:10px;font-size:14.8px;white-space:pre-line;word-break:break-word}
.pacts{display:flex;gap:6px;margin-top:11px}
.pact{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:999px;background:var(--surface-2)}
.pact svg{width:16px;height:16px}
.pact.liked{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.leader{margin:10px 14px 0;padding:4px 0}
.leadrow{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--line)}
.leadrow:last-child{border-bottom:0}
.leadrow .rank{width:22px;font-weight:800;color:var(--muted);font-size:14px;text-align:center;flex:none}
.leadrow .rank.top{color:var(--accent)}
.leadrow b{flex:1;font-size:14.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leadrow .pts{font-size:13px;font-weight:700;color:var(--primary)}
.comments{display:flex;flex-direction:column;gap:12px;padding:14px}
.comment{display:flex;gap:10px}
.comment .bub{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14px;flex:1}
.comment .bub b{display:block;font-size:12.5px;margin-bottom:2px}
.comment .bub span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.cbar{display:flex;gap:9px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:448px;background:var(--surface);border-top:1px solid var(--line);z-index:41}
.cbar input{flex:1;border:1px solid var(--line);background:var(--ground);border-radius:999px;padding:11px 16px;font-size:14.5px;min-width:0}
.cbar button{flex:none;width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
.cbar button svg{width:20px;height:20px}
.composer{padding:14px;display:flex;flex-direction:column;gap:12px}
.composer textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:13px 15px;font-size:15px;resize:vertical}
.catpick{display:flex;gap:8px;flex-wrap:wrap}

/* ---- Mes cours ---- */
.mccard{display:flex;gap:13px;padding:13px;align-items:center;text-align:left;width:100%}
.mccard .thumb{width:62px;height:62px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:26px;color:rgba(255,255,255,.85)}
.mccard .inf{flex:1;min-width:0}

`🎯 **Objectif :** maîtriser LA compétence qui change tout — écrire une consigne qui donne un résultat excellent.

Une bonne demande tient en **4 morceaux** : **Rôle + Tâche + Contexte + Format**.

       ["Donner un exemple pour guider le style",'8 min',

       ["Corriger et itérer",'8 min',
`🎯 **Objectif :** transformer une réponse « correcte » en réponse « parfaite » grâce à l'itération.

       ["L'IA peut se tromper : toujours vérifier",'9 min',
`🎯 **Objectif :** comprendre la seule vraie limite de ChatGPT — et le réflexe simple qui te protège.

ChatGPT peut énoncer une information **fausse avec assurance**. On appelle ça une « hallucination » : il invente un détail qui *semble* vrai. C'est la chose la plus importante à retenir de tout le cours.

## Ce qu'il ne faut JAMAIS utiliser sans vérifier

- Un **chiffre** (statistique, prix, pourcentage).
- Une **date** ou un **délai** légal.
- Une **loi**, une règle, une référence.
- Un **nom** propre ou une **citation**.

## La règle simple qui règle tout

L'IA est **fiable sur la forme** (rédiger, reformuler, organiser) et **à surveiller sur le fond** (les faits précis). Donc ton réflexe permanent :

1. Je fais **rédiger** par l'IA (gain de temps sur la forme).
2. Je **vérifie moi-même** les faits importants (à la source).
3. Je **valide**.

💡 **Astuce :** si un fait est crucial, demande « **es-tu sûr ? d'où vient cette information ?** ». Souvent, ChatGPT corrige ou reconnaît son incertitude. Mais la vérification finale reste la tienne.

⚠️ Ne copie **jamais** un chiffre de ChatGPT dans un document officiel sans l'avoir vérifié à la source. C'est la seule erreur qui peut vraiment te coûter cher.

✅ **À retenir :**
- L'IA peut **inventer** un fait avec assurance.
- Fiable sur la **forme**, à vérifier sur le **fond**.
- Faire rédiger → **vérifier les faits** → valider.

À toi de jouer : dans une réponse de ChatGPT, repère un élément factuel (chiffre, date) et vérifie-le à la source avant de t'en servir.`,null],
       ["Confidentialité : ce qu'on ne colle jamais",'9 min',
`🎯 **Objectif :** profiter de ChatGPT sans jamais exposer une donnée sensible de ton entreprise ou de tes clients.

       ["Respecter la politique de ton entreprise",'7 min',

     {t:'Fiable et responsable', l:[
       ["Vérifier les faits",'8 min',
`🎯 **Objectif :** garder le bon réflexe de vérification, même quand Claude s'appuie sur tes documents.

- Les **chiffres** cités (montants, pourcentages, totaux).

💡 **Astuce :** après un résumé, demande « **cite les passages exacts** sur lesquels tu bases les 3 points les plus importants ». Tu vérifies en un coup d'œil, sans relire tout le document.

       ["Confidentialité et données",'9 min',
`🎯 **Objectif :** analyser des documents avec Claude sans exposer de données sensibles.

       ["Esprit critique et bonnes habitudes",'8 min',
`🎯 **Objectif :** garder ton esprit critique et prendre les habitudes qui font durer le gain de temps.

       ["10 consignes prêtes à copier (documents et analyse)",'12 min',

       ["4 modèles à générer une fois, réutiliser pour toujours",'10 min',

`🎯 **Objectif de la leçon :** comprendre ce qu'est Copilot, en quoi il est différent des autres IA, et repérer où il va t'aider dans ta journée de travail.

Copilot est l'assistant IA de Microsoft. Comme ChatGPT ou Claude, tu lui écris une demande en langage normal et il t'aide à écrire, résumer, analyser ou créer. Mais il a une particularité qui change tout au bureau.

## Sa force : il est LÀ OÙ tu travailles

Les autres IA vivent dans un site web à part : tu dois copier ton texte, aller sur le site, coller, récupérer le résultat, revenir. Copilot, lui, est **intégré directement dans les logiciels Microsoft que beaucoup d'entreprises utilisent déjà** — tu n'as rien à copier-coller, il agit dans ton document ouvert.

Concrètement, un même assistant t'accompagne partout :

- **Word** — il rédige et reformule tes documents
- **Outlook** — il résume les longs e-mails et t'aide à répondre
- **Excel** — il analyse tes tableaux et propose des formules
- **PowerPoint** — il crée une première présentation
- **Teams** — il résume tes réunions (décisions, actions)

💡 **L'image à retenir :** ChatGPT, c'est un assistant assis dans un autre bureau — tu dois lui apporter le travail. Copilot, c'est un assistant assis **à côté de toi**, qui voit ton écran et agit directement dedans.

## Une condition importante

Cette intégration dans Word, Excel, etc. demande une **licence professionnelle Microsoft 365 Copilot**, activée par ton employeur (on voit ça à la leçon suivante). Il existe aussi un Copilot gratuit dans le navigateur Edge, utile pour discuter et rédiger, mais qui n'agit pas dans tes documents.

       ["Y accéder : une version professionnelle",'8 min',
`🎯 **Objectif :** savoir quelle version de Copilot tu peux utiliser, et comment vérifier en 2 minutes si tu y as accès.

Il existe **deux Copilot** différents. Ne pas les confondre t'évitera bien des malentendus.

## 1. Le Copilot gratuit (grand public)

Accessible à tous dans le navigateur **Edge** ou sur **copilot.microsoft.com**. Il discute, rédige, résume un texte que tu colles — comme ChatGPT. Utile, mais il **n'agit pas** dans tes fichiers Word ou Excel : c'est une fenêtre à part.

## 2. Le Copilot professionnel (Microsoft 365 Copilot)

C'est celui qui s'intègre **dans** Word, Excel, Outlook, PowerPoint et Teams. Il demande une **licence payante**, activée par ton **employeur** (ce n'est pas quelque chose que tu installes seul). C'est lui qui apporte le vrai gain de temps au bureau.

⚠️ **À éviter :** ne colle jamais un document confidentiel de ton entreprise dans le Copilot **grand public** (non géré par ton organisation). Pour le travail sensible, utilise uniquement la version professionnelle (on approfondit à la leçon « Confidentialité »).

À toi de jouer : ouvre une application Office et cherche l'icône Copilot. Si tu ne la trouves pas, note la question à poser à ton service informatique aujourd'hui.`,null],
       ["Où le trouver dans chaque application",'7 min',

Bonne nouvelle : le principe est **toujours le même**. Cherche l'**icône Copilot** (un petit logo coloré) dans le ruban du haut ou sur le côté droit. Une fois que tu l'as repérée une fois, tu sais l'utiliser partout.

       ["Reformuler, raccourcir, changer de ton",'8 min',

       ["Itérer et vérifier avant d'accepter",'7 min',

[COPIER] Résume cette conversation : qu'est-ce qui a été décidé, et qu'attend-on précisément de moi ?

Plus besoin de tout relire pour comprendre où on en est.

## 2. Rédiger une réponse selon TON intention

Tu dis simplement ce que tu veux répondre, Copilot rédige :

[COPIER] Rédige une réponse : j'accepte la réunion, mais je propose lundi 10 h plutôt que mercredi. Ton courtois et bref.

Tu relis, tu ajustes un mot, tu envoies.

## 3. Traiter les messages délicats

Pour un refus, un retard, une réclamation, demande une version qui **préserve la relation** :

- « Réponds pour refuser cette demande poliment, en proposant une alternative. »
- « Version plus diplomate, sans casser la relation. »

⚠️ **Règle d'or :** **relis toujours** avant d'envoyer. Un e-mail part en **ton nom** et engage ta responsabilité. Copilot fait le brouillon, la décision d'envoyer reste la tienne.

💡 **Astuce :** le matin, traite d'abord les longs fils : demande un résumé de chacun, réponds aux 2-3 simples, et ta boîte est sous contrôle avant ton premier café fini.

✅ **À retenir :**
- **Résumer** un long fil = 10 secondes.
- **Répondre** selon ton intention = un brouillon prêt à ajuster.
- **Relis** systématiquement avant d'envoyer.

À toi de jouer : sur un long fil d'e-mails réel, demande un résumé, puis fais rédiger une réponse courte. Chronomètre le temps gagné.`,null],
       ["Excel : analyser des données, créer des tableaux",'10 min',
`🎯 **Objectif :** comprendre et exploiter tes tableaux de chiffres, même si tu n'es pas à l'aise avec les formules Excel.

Excel fait peur à beaucoup de gens à cause des formules. Copilot change ça : tu poses ta question **en français**, il fait le calcul.

## Prépare ton tableau (1 étape importante)

Pour que Copilot fonctionne bien dans Excel, ton tableau doit être **mis en forme en « tableau »** : sélectionne tes données, puis menu **Insertion → Tableau** (ou Accueil → Mettre sous forme de tableau). Ça donne à Copilot une structure claire à analyser.

## Ce que tu peux demander (en français)

- **Comprendre** : « Quelles sont les 3 tendances principales de ces ventes ? »
- **Calculer** : « Ajoute une colonne qui calcule la marge (prix − coût). »
- **Synthétiser** : « Crée un tableau récapitulatif du total par mois. »
- **Visualiser** : « Fais un graphique des ventes par région. »
- **Repérer** : « Quels produits se vendent le moins ? »

Exemple concret sur un tableau de ventes :

[COPIER] Analyse ce tableau : donne-moi les 3 tendances principales, le mois le plus fort, et ajoute une colonne qui calcule la marge en pourcentage.

Copilot propose l'analyse **et** la formule ; tu valides d'un clic.

⚠️ **Vérifie toujours un chiffre à la main.** Copilot peut se tromper d'interprétation. Sur un résultat qui compte (un total, une marge), recalcule-en un toi-même pour être sûr avant de le présenter.

💡 **Astuce :** c'est l'occasion d'exploiter enfin des tableaux que tu n'avais jamais le temps d'analyser. 10 minutes avec Copilot valent une demi-journée de tri manuel.

✅ **À retenir :**
- Mets tes données **en forme de tableau** d'abord.
- Pose tes questions **en français**, pas en formules.
- **Revérifie** un chiffre clé avant de t'en servir.

À toi de jouer : sur un vrai tableau de chiffres, demande à Copilot les grandes tendances et un récapitulatif mensuel. Vérifie un des chiffres proposés.`,null],
       ["PowerPoint et Teams : présentations et réunions",'9 min',
`🎯 **Objectif :** monter une présentation en minutes et ne plus jamais rater ce qui s'est dit en réunion.

Deux tâches chronophages, deux gros gains avec Copilot.

## PowerPoint : une présentation en quelques minutes

Copilot génère une **première présentation complète** à partir d'un sujet ou, encore mieux, d'un document Word existant :

[COPIER] Crée une présentation de 8 diapositives à partir de ce rapport. Un message clé par diapositive, style sobre et professionnel, avec une diapositive de titre et une de conclusion.

Tu obtiens une trame visuelle structurée. Tu ajustes le texte, tu changes une image, et tu as gagné une heure de mise en page.

## Teams : ne plus jamais rater une réunion

Après une réunion Teams, Copilot la **résume** : décisions prises, **actions à faire et par qui**, points en suspens — **même si tu es arrivé en retard ou absent**.

[COPIER] Résume cette réunion : les décisions, la liste des actions avec le responsable de chacune, et les points restés en suspens.

## L'astuce qui te fait remarquer

Colle ce résumé dans un e-mail « Suivi de réunion » et envoie-le à l'équipe **juste après**. C'est **toi** qui envoies le compte rendu en premier — effet professionnel garanti, pour un effort de 3 minutes.

💡 **Astuce :** pour PowerPoint, pars toujours d'un document Word déjà rédigé si tu en as un : le résultat est bien meilleur que « à partir d'un sujet » seul.

✅ **À retenir :**
- PowerPoint : une **trame complète** à partir d'un sujet ou d'un Word.
- Teams : **résumé + actions + responsables** de chaque réunion.
- Envoie le suivi de réunion **le premier** : gros effet, petit effort.

À toi de jouer : à ta prochaine réunion Teams (ou depuis un compte rendu écrit), demande le résumé avec les actions et les responsables, puis prépare l'e-mail de suivi.`,null],
     ]},
     {t:'Fiable et responsable', l:[
       ["Vérifier avant d'envoyer",'8 min',
`🎯 **Objectif :** prendre le réflexe de vérification qui te protège des erreurs — le geste qui sépare l'amateur du pro.

Copilot travaille à partir de tes vrais documents, ce qui le rend souvent juste. Mais il peut **mal interpréter** une consigne ou **inventer** un détail avec assurance. Ta relecture est ta sécurité.

## Ce qu'il faut TOUJOURS revérifier

- **Les chiffres d'Excel** — recalcule un total ou une marge à la main.
- **Les faits d'une note** — une date, un nom, un montant, une règle interne.
- **Le sens d'une réponse d'e-mail** — dit-elle vraiment ce que tu veux ?
- **Les engagements** — Copilot n'a pas promis un délai que tu ne peux pas tenir ?

## La règle simple

L'IA est fiable sur la **forme** (rédiger, reformuler, structurer) et à **surveiller** sur le **fond** (les faits précis). Donc :

1. Je fais **produire** par Copilot (gain de temps).
2. Je **vérifie** les éléments factuels importants.
3. Je **valide** et j'envoie.

⚠️ **Jamais d'exception sur ce qui engage :** un chiffre présenté à ta direction, une clause, un montant client, un e-mail officiel. Vérifie **toujours** avant.

💡 **Astuce :** pour un fait douteux, demande à Copilot « **sur quelle partie du document te bases-tu ?** ». S'il ne peut pas pointer la source dans ta matière, méfie-toi.

✅ **À retenir :**
- L'IA **accélère**, la **responsabilité reste humaine**.
- Vérifie chiffres, faits, sens, engagements.
- Rien ne part **en ton nom** sans ta relecture.

À toi de jouer : après une analyse Excel faite par Copilot, revérifie **manuellement** un des chiffres proposés. Prends-en l'habitude.`,null],
       ["Confidentialité et périmètre professionnel",'9 min',
`🎯 **Objectif :** utiliser Copilot en toute sécurité avec les données de ton entreprise, sans faux pas.

Bonne nouvelle rassurante : dans la version **professionnelle Microsoft 365**, Copilot travaille **dans le périmètre de ton organisation** et respecte les **permissions** de tes fichiers. Il ne voit que ce que toi tu as le droit de voir, et tes données ne servent pas à entraîner un modèle public.

## La règle qui compte : le bon Copilot

- ✅ **Version pro (M365)** = tu peux travailler sur les documents de l'entreprise auxquels tu as accès.
- ⛔ **Version grand public** (site web, Edge non géré) = **n'y colle jamais** d'informations internes sensibles.

## Bonnes pratiques simples

- N'utilise pas Copilot pour **extraire ou diffuser** des données auxquelles tu n'as pas droit.
- Suis les **consignes de ton service informatique** (certaines entreprises ont des règles écrites).
- En cas de doute sur un document très sensible (RH, juridique, données clients), **demande** avant.

💡 **Le test simple :** « Serais-je à l'aise si un tiers voyait ce que je colle ? » Si non, ne le colle pas dans une version non gérée.

⚠️ **À éviter :** contourner les règles de l'entreprise « parce que c'est plus pratique ». La confiance se perd une seule fois.

✅ **À retenir :**
- Copilot **pro** respecte tes permissions et garde tes données dans l'entreprise.
- **Jamais** de données internes dans un Copilot grand public.
- En cas de doute → demande à l'IT.

À toi de jouer : vérifie si ton entreprise a une consigne écrite sur l'usage de l'IA. Note quel Copilot tu dois utiliser pour le travail sensible.`,null],
       ["Bonnes habitudes pour durer",'8 min',
`🎯 **Objectif :** transformer Copilot en habitude durable, au lieu d'un outil qu'on essaie une fois puis qu'on oublie.

La plupart des gens testent une IA, trouvent ça « sympa », puis retournent à leurs vieilles habitudes. Voici comment faire partie de ceux qui en tirent vraiment profit.

## La méthode : un seul outil à la fois

1. **Choisis UN outil** pour commencer — souvent **Outlook** (le plus rentable) ou **Word**.
2. Prends le réflexe de **cliquer sur Copilot** pour chaque résumé et chaque brouillon.
3. **Relis toujours** avant d'envoyer.
4. Quand c'est devenu automatique, **étends** à Excel, PowerPoint, Teams.

Vouloir tout faire d'un coup, c'est le meilleur moyen d'abandonner. Un outil maîtrisé vaut mieux que cinq survolés.

## Garde tes consignes qui marchent

Chaque fois qu'une consigne te donne un bon résultat, **copie-la dans un fichier** (« Mes consignes Copilot »). Tu les réutilises au lieu de réinventer. C'est ce fichier qui, en un mois, fait de toi la personne « douée avec l'IA » au bureau.

💡 **Astuce sécurité :** vérifie s'il existe une consigne interne sur l'IA chez toi, et respecte-la. Pour tout document officiel, la relecture humaine reste la norme.

✅ **À retenir :**
- **Un** outil à la fois, jusqu'à l'automatisme.
- **Relis** toujours, **garde** tes meilleures consignes.
- La régularité bat la perfection.

🎯 **Ton objectif de la semaine :** gagner **30 minutes par jour** sur tes e-mails grâce au résumé et à la réponse assistée dans Outlook.

À toi de jouer : choisis un outil et une tâche quotidienne, et utilise Copilot dessus **tous les jours** cette semaine. Viens raconter ton gain de temps dans la communauté.`,null],
     ]},

       ["Les consignes qui marchent, application par application",'12 min',
`Ta bibliothèque de départ, organisée par application. Copie-la dans ton téléphone, remplace les [crochets], et utilise chaque consigne directement dans l'application concernée.

**PowerPoint — créer** : « Crée une présentation de [8] diapositives à partir de [ce document Word / ce sujet], style sobre, un message clé par diapositive. »

       ["Ta routine quotidienne : matin, midi, fin de journée",'10 min',
`Le vrai gain avec Copilot ne vient pas d'un exploit ponctuel, mais d'une routine simple répétée chaque jour. En voici une qui a fait ses preuves — adapte-la à ton poste.

**Le matin (10 min)** : ouvre Outlook, demande le résumé des longs fils arrivés depuis hier ; fais rédiger les 2-3 réponses simples ; relis, ajuste, envoie. Ta boîte est sous contrôle avant même ton premier café fini.

**Après chaque réunion Teams (3 min)** : demande le résumé avec décisions et actions ; colle-le dans un e-mail « suivi de réunion » à l'équipe. C'est toi qui envoies le compte rendu en premier — effet professionnel garanti.

**Avant un document (5 min)** : au lieu de partir de zéro dans Word, demande le premier jet avec sujet, public et longueur. Ton travail devient : améliorer, pas créer.

**Le vendredi (10 min)** : dans Excel, demande les tendances de tes chiffres de la semaine ; note les 3 points pour ton point hebdo.

À toi de jouer : choisis les 2 moments de la routine les plus utiles pour TON poste et mets un rappel dans ton téléphone pour demain matin.`,null],
       ["Ton plan d'action : 7 jours pour en faire un réflexe",'10 min',

   modules:[
     {t:'Se présenter', l:[
       ["Hello ! Te présenter en 6 phrases",'8 min',
`Apprends ces six phrases par cœur — elles couvrent 90 % des présentations :

**Hello, my name is Awa.** (Bonjour, je m'appelle Awa.) **I'm from Côte d'Ivoire.** (Je viens de Côte d'Ivoire.) **I live in Abidjan.** (J'habite à Abidjan.) **I work in a shop.** / **I'm a student.** (Je travaille dans une boutique. / Je suis étudiant·e.) **Nice to meet you!** (Enchanté·e !) **And you?** (Et toi ?)

Prononciation : ne cherche pas la perfection, cherche à être compris. Parle lentement et articule. « Nice to meet you » se dit à peu près « naïss tou mit you ».

À toi de jouer : enregistre-toi sur ton téléphone en te présentant avec ces 6 phrases, puis réécoute. Fais-le 3 jours de suite : tu verras la différence.`,null],
       ["Dire ce que tu fais dans la vie",'7 min',
`Pour parler de ton activité, une structure suffit : **I'm a…** (je suis…) ou **I work in / as…** (je travaille dans / comme…).

**I'm a seller.** (Je suis vendeur·se.) **I'm a driver.** (chauffeur) **I'm a hairdresser.** (coiffeur·se) **I'm a teacher.** (enseignant·e) **I work in a restaurant.** (Je travaille dans un restaurant.) **I have a small business.** (J'ai un petit commerce.) **I'm looking for a job.** (Je cherche du travail.)

Ajoute une phrase sur ce que tu vends ou fais : **I sell shoes.** (Je vends des chaussures.) **I make dresses.** (Je fais des robes.)

À toi de jouer : écris 2 phrases sur ton activité (ou celle que tu vises) et dis-les à voix haute jusqu'à les dire sans lire.`,null],
     ]},
     {t:'Le vocabulaire de survie', l:[
       ["Grande leçon vidéo : le vocabulaire de base",'60 min',
`Cette leçon vidéo intensive couvre le vocabulaire de base pour débutant, en français. Elle est longue : ne la regarde pas d'un coup !

**La bonne méthode** : 10 à 15 minutes par jour, en répétant chaque mot à voix haute après la vidéo. Mets sur pause, répète, avance. Ton oreille et ta bouche apprennent en même temps.

Reviens marquer cette leçon comme terminée quand tu as fini la vidéo — même si cela te prend une semaine. C'est le rythme normal.

À toi de jouer : chaque jour, note 5 mots de la vidéo dans ton téléphone et utilise-les dans une phrase.`,'fDxP2m6qvH4'],
       ["Les 20 phrases de tous les jours",'8 min',
`Ces phrases reviennent sans arrêt. Apprends-en 4 par jour pendant 5 jours :

**Thank you (very much).** Merci (beaucoup). **You're welcome.** De rien. **Please.** S'il te plaît. **Excuse me.** Excusez-moi. **I'm sorry.** Pardon. **Yes / No / Maybe.** Oui / Non / Peut-être. **I don't understand.** Je ne comprends pas. **Can you repeat, please?** Tu peux répéter ? **Slowly, please.** Doucement, s'il te plaît. **How much is it?** C'est combien ? **Where is…?** Où est… ? **What time is it?** Quelle heure est-il ? **I would like…** Je voudrais… **Of course.** Bien sûr. **No problem.** Pas de problème. **See you later!** À plus tard ! **Have a nice day!** Bonne journée ! **I don't know.** Je ne sais pas. **Can you help me?** Tu peux m'aider ? **It's okay.** Ça va.

À toi de jouer : choisis les 5 phrases qui te serviront le plus et utilise-les aujourd'hui, même seul·e à voix haute.`,null],
     ]},
     {t:'Communiquer vraiment', l:[
       ["Poser une question polie",'8 min',
`La politesse anglaise tient en deux formules magiques : **Can you…?** (Tu peux… ?) et **Could you…, please?** (Pourriez-vous…, s'il vous plaît ? — plus poli).

**Can you help me, please?** (Tu peux m'aider ?) **Could you repeat, please?** (Pourriez-vous répéter ?) **Can I pay with mobile money?** (Je peux payer par mobile money ?) **Could you send me the price?** (Pourriez-vous m'envoyer le prix ?)

Pour comprendre la réponse, guette les mots clés : **yes / no / sure** (bien sûr) / **sorry** (désolé) / **later** (plus tard) / **tomorrow** (demain).

À toi de jouer : écris 3 questions « Can you… ? » utiles dans TA vie (travail, marché, téléphone) et répète-les.`,null],
       ["Écrire un message simple (WhatsApp, e-mail)",'9 min',

À toi de jouer : écris un message de 3 phrases en anglais pour demander le prix d'un produit, comme si tu l'envoyais vraiment.`,null],
       ["Ton plan des 30 prochains jours",'6 min',
`La langue s'apprend par petites doses répétées, pas en une fois. Voici un plan simple et tenable :

function ago(t){
  const s = Math.max(1,(Date.now()-t)/1000);
  if(s<60) return 'à l\'instant';
  if(s<3600) return `il y a ${Math.floor(s/60)} min`;
  if(s<86400) return `il y a ${Math.floor(s/3600)} h`;
  if(s<7*86400) return `il y a ${Math.floor(s/86400)} j`;
  return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

const DEMO_COUPONS_KEY = 'boyia-coupons-v1';
function demoCoupons(){
  try{ const v=JSON.parse(localStorage.getItem(DEMO_COUPONS_KEY)); if(Array.isArray(v)) return v; }catch(e){}
  return [{code:'CADEAU200', type:'fixed', value:200, active:true, label:'Test — prix fixe 200 F', uses:0}];
}
function saveDemoCoupons(list){ try{ localStorage.setItem(DEMO_COUPONS_KEY, JSON.stringify(list)); }catch(e){} }
function couponCompute(base, c){
  if(!c || !c.active) return {amount:base, free:false};
  let a=base;
  if(c.type==='percent') a=base*(1-c.value/100);
  else if(c.type==='amount') a=base-c.value;
  else if(c.type==='fixed') a=c.value;
  a=Math.round(a);
  if(!isFinite(a)||a<=0) return {amount:0, free:true};
  return {amount:Math.max(100,a), free:false};
}
function couponSummary(c){
  if(!c) return '';
  if(c.type==='percent') return `-${c.value} %`;
  if(c.type==='amount') return `-${fcfa(c.value)}`;
  return `Prix fixe ${fcfa(c.value)}`;
}
async function couponResolve(courseId, code){
  if(API.mode==='live'){
    const r = await fetch('/api/coupon', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({courseId, code})});
    return await r.json();
  }
  const base = courseById(courseId).price;
  const c = demoCoupons().find(x=>x.code===String(code).toUpperCase());
  if(!c || !c.active) return {valid:false, original:base};
  const r = couponCompute(base, c);
  return {valid:true, code:c.code, original:base, amount:r.amount, free:r.free, summary:couponSummary(c)};
}

/* Rendu enrichi d'une leçon (compatible avec l'ancien format = simples paragraphes).
   Balises de bloc (un bloc = séparé par une ligne vide) :
     ## Titre            → sous-titre
     - item / • item     → liste à puces
     1. étape            → étapes numérotées
     🎯 …                → objectif · 💡 … astuce · ⚠️ … piège · ✅/📌 … à retenir
     [COPIER] …          → carte « consigne à copier » (bouton Copier)
     À toi de jouer : …  → carte exercice
   En ligne : **gras**. */
function fmtBody(txt){
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const innerCallout = lines => {
    const lead=[], bul=[];
    for(const l of lines){ if(/^[-•]\s/.test(l)) bul.push(l.replace(/^[-•]\s*/,'')); else lead.push(l); }
    let h = lead.length ? `<span>${inl(lead.join('\n')).replace(/\n/g,'<br>')}</span>` : '';
    if(bul.length) h += `<ul>${bul.map(b=>`<li>${inl(b)}</li>`).join('')}</ul>`;
    return h;
  };
  const cals = [['🎯','obj'],['💡','tip'],['⚠️','warn'],['✅','key'],['📌','key']];
  return txt.trim().split(/\n{2,}/).map(raw=>{
    const p = raw.trim(); if(!p) return '';
    const lines = p.split('\n').map(l=>l.trim()).filter(Boolean);
    if(/^À toi de jouer\s*:/.test(p))
      return `<div class="exo">${inl(p).replace(/^À toi de jouer\s*:/,'<b>✏️ À toi de jouer :</b>').replace(/\n/g,'<br>')}</div>`;
    if(p.startsWith('## ')) return `<h3 class="lh">${inl(p.slice(3))}</h3>`;
    if(p.startsWith('[COPIER]')){
      const body = p.replace(/^\[COPIER\]\s*/,'');
      return `<div class="copycard"><div class="cc-h"><span class="cc-t">📋 Consigne à copier</span><button class="cc-btn" onclick="App.copyText(this)">Copier</button></div><pre>${esc(body)}</pre></div>`;
    }
    const cal = cals.find(c=>p.startsWith(c[0]));
    if(cal) return `<div class="cal ${cal[1]}">${innerCallout(lines)}</div>`;
    if(lines.length && lines.every(l=>/^\d+[.)]\s/.test(l)))
      return `<ol class="steps">${lines.map(l=>`<li>${inl(l.replace(/^\d+[.)]\s*/,''))}</li>`).join('')}</ol>`;
    if(lines.length && lines.every(l=>/^[-•]\s/.test(l)))
      return `<ul class="lul">${lines.map(l=>`<li>${inl(l.replace(/^[-•]\s*/,''))}</li>`).join('')}</ul>`;
    return `<p>${inl(p).replace(/\n/g,'<br>')}</p>`;
  }).join('');
}
/* Copie de secours quand navigator.clipboard n'est pas disponible (anciens mobiles). */
function fallbackCopy(text, done){
  try{
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); done&&done();
  }catch(e){ toast('Copie impossible — sélectionne le texte manuellement.'); }
}

/* ================= Écran : Espace admin (coupons) ================= */
function screenAdmin(){
  const back = `<div class="subhead"><button class="iconbtn" onclick="App.tab('profil')" aria-label="Retour">${I.back}</button><h1>Espace admin</h1></div>`;
  // Connexion requise en mode réel
  if(API.mode==='live' && !ADMIN.key){
    return `<div class="screen">${back}
      <div class="px" style="padding-top:8px">
        <div class="card" style="padding:18px 16px">
          <b style="font-size:15px">Connexion admin</b>
          <p class="muted" style="font-size:13.5px;margin:6px 0 14px">Entre le mot de passe admin (variable <code>ADMIN_PASSWORD</code>).</p>
          <input id="adminkey" class="qinput" type="password" placeholder="Mot de passe" style="font-size:18px" onkeydown="if(event.key==='Enter')App.adminLogin()">
          <p class="qerr">${ADMIN.err?esc(ADMIN.err):''}</p>
          <button class="btn" onclick="App.adminLogin()">Se connecter ${I.arrowr}</button>
        </div>
      </div></div>`;
  }
  if(ADMIN.err && !ADMIN.list){
    return `<div class="screen">${back}<div class="empty">${I.shield}<b>${esc(ADMIN.err)}</b>
      <span>Ajoute la variable d'environnement <code>ADMIN_PASSWORD</code> sur Vercel pour activer l'espace admin en ligne.</span></div></div>`;
  }
  const T = ADMIN.tab;
  const tabBtn=(id,label)=>`<button class="chip ${T===id?'on':''}" onclick="App.adminTab('${id}')">${label}</button>`;
  const tabs = `<div class="chiprow" style="padding-top:10px">
    ${tabBtn('dash','Tableau de bord')}${tabBtn('orders','Commandes')}${tabBtn('members','Membres')}${tabBtn('coupons','Coupons')}${tabBtn('system','Système')}
  </div>`;

  const loading = `<div class="adminwrap"><div class="empty">${I.clock}<b>Chargement…</b></div></div>`;
  const demoBlock = `<div class="adminwrap"><div class="empty" style="padding:36px 24px">${I.shield}<b>Données en ligne</b>
    <span>Cette section affiche les vraies données une fois l'app déployée. En mode démo local, seule la gestion des coupons fonctionne.</span></div></div>`;

  let panel;
  if(T==='orders'){
    panel = (API.mode!=='live') ? demoBlock : adminOrdersPanel();
  } else if(T==='members'){
    panel = (API.mode!=='live') ? demoBlock : adminMembersPanel();
  } else if(T==='system'){
    panel = adminSystemPanel();
  } else if(ADMIN.tab==='coupons'){
    const list = ADMIN.list || [];
    panel = `
      <div class="sect">Coupons (${list.length})</div>
      <div class="adminwrap">
        <div class="card">
          ${list.length? list.map(c=>`<div class="cpn" style="border-bottom:1px solid var(--line)">
            <div class="grow"><div class="c-code">${esc(c.code)} ${c.active?'':'<span class="muted" style="font-weight:500;font-size:12px">(inactif)</span>'}</div>
              <div class="c-sum">${esc(couponSummary(c))}${c.label?` · ${esc(c.label)}`:''}</div>
              <div class="c-uses">${(c.uses||0)} utilisation${(c.uses||0)>1?'s':''}</div></div>
            <button class="tgl ${c.active?'on':''}" onclick="App.adminToggle('${esc(c.code)}')" aria-label="Activer/désactiver"><i></i></button>
            <button class="del" onclick="App.adminDelete('${esc(c.code)}')" aria-label="Supprimer">${I.trash}</button>
          </div>`).join('') : `<div style="padding:16px;text-align:center;color:var(--muted);font-size:14px">Aucun coupon.</div>`}
        </div>
        <div class="card" style="padding:15px">
          <b style="font-size:14.5px">Nouveau coupon</b>
          <div style="display:flex;flex-direction:column;gap:11px;margin-top:12px">
            <label class="afield">Code<input id="a_code" type="text" placeholder="Ex. CADEAU200" style="text-transform:uppercase"></label>
            <div class="arow">
              <label class="afield">Type
                <select id="a_type" onchange="App.adminTypeHint()">
                  <option value="fixed">Prix fixe (FCFA)</option>
                  <option value="percent">Réduction (%)</option>
                  <option value="amount">Réduction (FCFA)</option>
                </select>
              </label>
              <label class="afield">Valeur<input id="a_value" type="number" inputmode="numeric" placeholder="200"></label>
            </div>
            <label class="afield">Libellé (optionnel)<input id="a_label" type="text" placeholder="Ex. Promo lancement"></label>
            <button class="btn" onclick="App.adminSave()">Enregistrer le coupon</button>
          </div>
        </div>
      </div>`;
  } else {
    // Tableau de bord
    const s = ADMIN.stats;
    if(API.mode!=='live'){
      panel = `<div class="adminwrap"><div class="empty" style="padding:36px 24px">${I.shield}<b>Statistiques en ligne</b>
        <span>Le tableau de bord (ventes, chiffre d'affaires, commandes) affiche les vraies données une fois l'app déployée. En mode démo local, il n'y a pas de commandes réelles.</span></div></div>`;
    } else if(!s){
      panel = `<div class="adminwrap"><div class="empty">${I.clock}<b>Chargement…</b></div></div>`;
    } else {
      const conv = s.total ? Math.round(100*s.paid/s.total) : 0;
      const kpi = (label,val,accent)=>`<div class="kpi"><span class="k-val" ${accent?`style="color:var(--primary)"`:''}>${val}</span><span class="k-lab">${label}</span></div>`;
      panel = `
        <div class="kpis">
          ${kpi('Chiffre d\'affaires', fcfa(s.revenue), true)}
          ${kpi('Inscriptions payées', s.paid)}
          ${kpi('Membres', s.members!=null?s.members:'—')}
          ${kpi('Taux de conversion', conv+' %')}
          ${kpi('Commandes', s.total)}
          ${kpi('Cours débloqués', s.enrollments!=null?s.enrollments:'—')}
        </div>
        <div class="adminwrap">
          <div class="sect" style="padding-left:0">Ventes par cours</div>
          <div class="card">
            ${s.byCourse.length? s.byCourse.map(x=>`<div class="cpn" style="border-bottom:1px solid var(--line)">
              <div class="grow"><div class="c-code" style="font-size:14px">${esc(x.name)}</div>
                <div class="c-sum">${x.count} inscription${x.count>1?'s':''}</div></div>
              <b class="num" style="color:var(--primary)">${fcfa(x.revenue)}</b>
            </div>`).join('') : `<div style="padding:16px;text-align:center;color:var(--muted);font-size:14px">Aucune vente pour l'instant.</div>`}
          </div>
          <div class="sect" style="padding-left:0">Dernières commandes</div>
          <div class="card">
            ${(ADMIN.recent||[]).length? ADMIN.recent.map(o=>`<div class="cpn" style="border-bottom:1px solid var(--line)">
              <div class="grow"><div class="c-code" style="font-size:13.5px">${o.buyer?esc((o.buyer.prenom||'')+' '+(o.buyer.nom||'')):esc(o.ref)}</div>
                <div class="c-sum">${esc(o.name)}${o.coupon?` · <span style="color:var(--primary)">${esc(o.coupon)}</span>`:''}</div>
                <div class="c-uses">${o.createdAt?ago(o.createdAt):''} · ${esc(o.ref)}</div></div>
              <div style="text-align:right"><b class="num">${fcfa(o.amount)}</b><div>${ordPill(o.status)}</div></div>
            </div>`).join('') : `<div style="padding:16px;text-align:center;color:var(--muted);font-size:14px">Aucune commande.</div>`}
          </div>
          ${s.pending?`<p class="muted" style="font-size:12.5px;text-align:center">${s.pending} commande(s) en attente de confirmation.</p>`:''}
        </div>`;
    }
  }
  return `<div class="screen">${back}${tabs}${panel}
    ${API.mode==='live'?`<div class="px" style="padding-bottom:24px"><button class="btn ghost" onclick="App.adminLogout()">Se déconnecter</button></div>`:''}
  </div>`;
}
function ordPill(st){
  if(st==='paid') return `<span class="pill free">payé</span>`;
  if(st==='failed') return `<span class="pill" style="background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)">échoué</span>`;
  return `<span class="pill paid">en attente</span>`;
}

/* ===== Comptes serveur : authentification par e-mail + code à 6 chiffres ===== */
function authHeaders(){ return Object.assign({'Content-Type':'application/json'}, S.token?{'Authorization':'Bearer '+S.token}:{}); }
async function acctFetch(path, body){
  const r = await fetch(path, {method:'POST', headers:authHeaders(), cache:'no-store', body: body?JSON.stringify(body):undefined});
  let json={}; try{ json=await r.json(); }catch(e){}
  return {status:r.status, json};
}
/* Fusionne les données serveur (compte, inscriptions, progression, points) dans l'état local. */
function applyAccount(j){
  if(!j) return;
  if(j.token) S.token=j.token;
  if(j.user){
    S.user = {prenom:j.user.prenom||'', nom:j.user.nom||'', whatsapp:j.user.whatsapp||'', email:j.user.email||'', prefix:j.user.prefix||'+225'};
    if(typeof j.user.points==='number') S.points=j.user.points;
  }
  if(Array.isArray(j.enrollments)) for(const e of j.enrollments){
    const cur = S.enrolled[e.courseId]||{at:e.at||Date.now()};
    S.enrolled[e.courseId] = {at:cur.at, paid: cur.paid||!!e.paid, op: e.paid?'Wave':(cur.op||null), ref: e.orderRef||cur.ref||null};
    if(!S.done[e.courseId]) S.done[e.courseId]={};
  }
  if(Array.isArray(j.progress)) for(const p of j.progress){ if(!S.done[p.courseId]) S.done[p.courseId]={}; S.done[p.courseId][p.lessonKey]=true; }
  save();
}
/* Au chargement : si on a un jeton, on récupère le compte à jour (autre appareil, nouveaux cours). */
async function hydrateAccount(){
  if(!S.token || !/^https?:$/.test(location.protocol)) return;
  try{
    const r = await fetch('/api/me', {headers:authHeaders(), cache:'no-store'});
    if(r.status===401){ S.token=null; save(); render(); return; }
    if(r.ok){ applyAccount(await r.json()); render(); }
  }catch(e){}
}

/* ================= Actions ================= */
const App = {
  tab(t){ filters.q=''; go(t, {cours:'catalog',commu:'feed',mescours:'my',profil:'profil'}[t]); },
  search(q){ filters.q=q; const list=$('#main'); V.screen='catalog';
    // re-render en conservant le focus de la recherche
    render(); const inp=document.querySelector('.search input'); if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);} },
  cat(c){ filters.cat=c; render(); },
  commuCat(c){ filters.commu=c; render(); },
  openCourse(id){ go('cours','course',{id}); },
  openLearn(id){ if(!S.enrolled[id]){ this.openCourse(id); return; } go('mescours','learn',{id}); },
  openLesson(cid,k){
    if(!S.enrolled[cid]){ this.enroll(cid); return; }
    go('mescours','lesson',{id:cid,k});
  },
  toast(m){ toast(m); },
  copyText(btn){
    const pre = btn.closest('.copycard') && btn.closest('.copycard').querySelector('pre');
    const t = pre ? pre.innerText : '';
    const done = ()=>{ btn.textContent='Copié ✓'; toast('Consigne copiée — colle-la dans ton outil ✨'); setTimeout(()=>{ if(btn) btn.textContent='Copier'; },1800); };
    try{ navigator.clipboard.writeText(t).then(done, ()=>fallbackCopy(t,done)); }catch(e){ fallbackCopy(t,done); }
  },

  /* --- Inscription / enrôlement --- */
  enroll(cid){
    const c = courseById(cid);
    if(S.user){
      if(c.price>0){ flow={type:'pay', courseId:cid, step:'op', data:{prefix:S.user.prefix||'+225', phone:S.user.whatsapp}}; }
      else { this.finishEnroll(cid,null); return; }
    } else {
      flow={type:'enroll', courseId:cid, step:0, data:{}};
    }
    renderFlow();
  },
  enrollGeneric(){ flow={type:'enroll', courseId:null, step:0, data:{}, ctx:'account'}; renderFlow(); },
  flowClose(giveUp){
    if(flow && (flow.step==='wait' || flow.step==='redirect')) return;
    if(flow && flow.type==='pay' && (giveUp || flow.step==='failed')){ delete S.pendingOrder; save(); }
    flow=null; renderFlow(); render();
  },
  flowBack(){ if(flow.step>0){ this.flowSaveInput(); flow.step--; flow.err=null; renderFlow(); } },
  flowSaveInput(){
    const steps = enrollSteps();
    if(flow.step<steps.length){

/* ===== Suivi robuste du paiement Wave =====
   Le sondage ne « lâche » jamais tant que l'écran de paiement est ouvert, et il
   REPART tout seul dès que l'app redevient visible (retour depuis l'app Wave ou
   un autre navigateur) — c'est ce qui évite l'écran qui tourne sans fin sur mobile,
   où les navigateurs gèlent les minuteurs des onglets en arrière-plan. */
const PENDING_MAX_AGE = 60*60*1000;   // au-delà d'1 h, on ne relance plus une vieille commande
let payWatch = { ref:null, tries:0, timer:null, busy:false, gen:0 };
function payWatchStop(){ if(payWatch.timer){ clearTimeout(payWatch.timer); payWatch.timer=null; } payWatch.ref=null; payWatch.gen++; }
async function payCheckOnce(){
  const ref = payWatch.ref; if(!ref || payWatch.busy) return false;
  payWatch.busy = true;
  try{
    const r = await fetch('/api/order?ref='+encodeURIComponent(ref), {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j.status==='paid'){ App.onPaid(j); return true; }
      if(j.status==='failed'){ App.onPayFailed(); return true; }
    }
  }catch(e){/* réseau : on réessaiera */}
  finally{ payWatch.busy = false; }
  return false;
}
/* Une seule chaîne de minuteurs à la fois (jeton `gen`) : les événements focus/visibility
   multiples ne créent jamais de sondages parallèles. */
function payWatchTick(gen){
  if(gen!==payWatch.gen || !payWatch.ref) return;
  const ref = payWatch.ref;
  payCheckOnce().then(done=>{
    if(gen!==payWatch.gen) return;
    if(done || payWatch.ref!==ref){ if(done) payWatchStop(); return; }
    payWatch.tries++;
    /* Message rassurant si Wave met du temps — sans jamais déclarer d'échec. */
    if(payWatch.tries===12 && flow && flow.type==='pay' && flow.step==='poll' && !flow.data.slow){ flow.data.slow=true; renderFlow(); }
    const delay = payWatch.tries<20 ? 2000 : 4000;
    payWatch.timer = setTimeout(()=>payWatchTick(gen), delay);
  });
}
function payWatchStart(ref){ if(!ref) return; payWatchStop(); payWatch.ref=ref; payWatch.tries=0; const g=++payWatch.gen; payWatchTick(g); }
/* Reprise immédiate quand l'utilisateur revient dans l'app. */
function payResume(){
  if(document.visibilityState==='hidden') return;
  if(payWatch.ref){                                   // sondage en cours : on revérifie tout de suite
    if(payWatch.timer){ clearTimeout(payWatch.timer); payWatch.timer=null; }
    const g=++payWatch.gen; payWatchTick(g);
  } else if(S.pendingOrder && S.pendingOrder.ref && !S.enrolled[S.pendingOrder.courseId]){
    resumePendingPayment();                           // page restaurée (BFCache) : on relance
  }
}
/* Ouvre/relance l'écran de suivi pour une commande en attente. */
function resumePendingPayment(retFailed){
  const po = S.pendingOrder;
  if(!po || !po.ref) return false;
  if(po.at && Date.now()-po.at > PENDING_MAX_AGE){ delete S.pendingOrder; save(); return false; }
  if(po.courseId && S.enrolled[po.courseId]){ delete S.pendingOrder; save(); return false; }
  if(!flow || flow.type!=='pay' || flow.data.ref!==po.ref){
    flow = {type:'pay', courseId:po.courseId, step: retFailed ? 'failed' : 'poll', data:{op:'wave', ref:po.ref}};
    if(retFailed) flow.data.timeout=true;
    renderFlow();
  }
  if(flow.step==='poll') payWatchStart(po.ref);
  return true;
}
document.addEventListener('visibilitychange', payResume);
window.addEventListener('focus', payResume);
window.addEventListener('pageshow', payResume);   // restauration depuis le cache arrière/avant

/* Retour d'un paiement Wave : success_url/error_url ramènent ici avec ?wave=success|error&ref=…
   On enregistre la référence puis on laisse le suivi robuste faire son travail. */
(function resumeWavePayment(){
  const qs = new URLSearchParams(location.search);
  const ret = qs.get('wave');
  const refUrl = qs.get('ref');
  if(ret || refUrl) history.replaceState(null, '', location.pathname + location.hash);
  const ref = (S.pendingOrder && S.pendingOrder.ref) || refUrl;
  if(!ref) return;                       // rien à reprendre
  if(!S.pendingOrder || S.pendingOrder.ref!==ref) S.pendingOrder = {ref, courseId:(S.pendingOrder&&S.pendingOrder.courseId)||null, at:Date.now()};
  resumePendingPayment(ret==='error');
})();

/* Compte serveur : si on a un jeton, on synchronise (profil, cours payés, progression). */
hydrateAccount();

/* Accès direct à l'espace admin : /boyiaadmin ou #admin */
if(location.pathname.replace(/\/+$/,'')==='/boyiaadmin' || location.hash==='#admin') App.openAdmin();
window.addEventListener('hashchange', ()=>{ if(location.hash==='#admin') App.openAdmin(); });
</script>
