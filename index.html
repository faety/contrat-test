/* ===== Coupons (client) : live via l'API, démo via localStorage ===== */
const DEMO_COUPONS_KEY = 'boyia-coupons-v1';
function demoCoupons(){
  try{ const v=JSON.parse(localStorage.getItem(DEMO_COUPONS_KEY)); if(Array.isArray(v)) return v; }catch(e){}
  return [{code:'CADEAU200', type:'fixed', value:200, active:true, label:'Test — prix fixe 200 F', uses:0}];
}
function saveDemoCoupons(list){ try{ localStorage.setItem(DEMO_COUPONS_KEY, JSON.stringify(list)); }catch(e){} }
function couponCompute(base, c){
  if(!c || !c.active) return {amount:base, free:false};
  let a=base;
  if(c.type==='percent') a=base*(1-c.value/100);
  else if(c.type==='amount') a=base-c.value;
  else if(c.type==='fixed') a=c.value;
  a=Math.round(a);
  if(!isFinite(a)||a<=0) return {amount:0, free:true};
  return {amount:Math.max(100,a), free:false};
}
function couponSummary(c){
  if(!c) return '';
  if(c.type==='percent') return `-${c.value} %`;
  if(c.type==='amount') return `-${fcfa(c.value)}`;
  return `Prix fixe ${fcfa(c.value)}`;
}
async function couponResolve(courseId, code){
  if(API.mode==='live'){
    const r = await fetch('/api/coupon', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({courseId, code})});
    return await r.json();
  }
  const base = courseById(courseId).price;
  const c = demoCoupons().find(x=>x.code===String(code).toUpperCase());
  if(!c || !c.active) return {valid:false, original:base};
  const r = couponCompute(base, c);
  return {valid:true, code:c.code, original:base, amount:r.amount, free:r.free, summary:couponSummary(c)};
}
let ADMIN = { key: (function(){try{return localStorage.getItem('boyia-admin-key')||''}catch(e){return ''}})(), list:null, err:'', tab:'dash', stats:null, recent:null };
async function adminApi(method, body){
  const r = await fetch('/api/admin/coupons', {method, headers:{'Content-Type':'application/json','x-admin-key':ADMIN.key},
    body: body?JSON.stringify(body):undefined});
  let json={}; try{ json=await r.json(); }catch(e){}
  return {status:r.status, json};
}
function addPoints(n, why){ S.points += n; save(); toast(`+${n} points — ${why}`); }
function courseById(id){ return COURSES.find(c=>c.id===id); }
function lessonCount(c){ return c.modules.reduce((a,m)=>a+m.l.length,0); }
function doneCount(c){ return Object.keys(S.done[c.id]||{}).length; }
function courseProgress(c){ return Math.round(100*doneCount(c)/lessonCount(c)); }
function fmtBody(txt){
  return txt.trim().split(/\n{2,}/).map(p=>{
    let h = esc(p.trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(p.trim().startsWith('À toi de jouer')){
      h = h.replace(/^À toi de jouer\s*:/,'<b>✏️ À toi de jouer :</b>');
      return `<div class="exo">${h}</div>`;
    }
    return `<p>${h}</p>`;
  }).join('');
}

              <div class="c-sum">${esc(couponSummary(c))}${c.label?` · ${esc(c.label)}`:''}</div>
              <div class="c-uses">${(c.uses||0)} utilisation${(c.uses||0)>1?'s':''}</div></div>
            <button class="tgl ${c.active?'on':''}" onclick="App.adminToggle('${esc(c.code)}')" aria-label="Activer/désactiver"><i></i></button>
            <button class="del" onclick="App.adminDelete('${esc(c.code)}')" aria-label="Supprimer">${I.trash}</button>
          </div>`).join('') : `<div style="padding:16px;text-align:center;color:var(--muted);font-size:14px">Aucun coupon.</div>`}
        </div>
        <div class="card" style="padding:15px">
          <b style="font-size:14.5px">Nouveau coupon</b>
          <div style="display:flex;flex-direction:column;gap:11px;margin-top:12px">
            <label class="afield">Code<input id="a_code" type="text" placeholder="Ex. CADEAU200" style="text-transform:uppercase"></label>
            <div class="arow">
              <label class="afield">Type
                <select id="a_type" onchange="App.adminTypeHint()">
                  <option value="fixed">Prix fixe (FCFA)</option>
                  <option value="percent">Réduction (%)</option>
                  <option value="amount">Réduction (FCFA)</option>
                </select>
              </label>
              <label class="afield">Valeur<input id="a_value" type="number" inputmode="numeric" placeholder="200"></label>
            </div>
            <label class="afield">Libellé (optionnel)<input id="a_label" type="text" placeholder="Ex. Promo lancement"></label>
            <button class="btn" onclick="App.adminSave()">Enregistrer le coupon</button>
          </div>
        </div>
      </div>`;
  } else {
    // Tableau de bord
    const s = ADMIN.stats;
    if(API.mode!=='live'){
      panel = `<div class="adminwrap"><div class="empty" style="padding:36px 24px">${I.shield}<b>Statistiques en ligne</b>
        <span>Le tableau de bord (ventes, chiffre d'affaires, commandes) affiche les vraies données une fois l'app déployée. En mode démo local, il n'y a pas de commandes réelles.</span></div></div>`;
    } else if(!s){
      panel = `<div class="adminwrap"><div class="empty">${I.clock}<b>Chargement…</b></div></div>`;
    } else {
      const conv = s.total ? Math.round(100*s.paid/s.total) : 0;
      const kpi = (label,val,accent)=>`<div class="kpi"><span class="k-val" ${accent?`style="color:var(--primary)"`:''}>${val}</span><span class="k-lab">${label}</span></div>`;
      panel = `
        <div class="kpis">
          ${kpi('Chiffre d\'affaires', fcfa(s.revenue), true)}
          ${kpi('Inscriptions payées', s.paid)}
          ${kpi('Commandes', s.total)}
          ${kpi('Taux de conversion', conv+' %')}
        </div>
        <div class="adminwrap">
          <div class="sect" style="padding-left:0">Ventes par cours</div>
          <div class="card">
            ${s.byCourse.length? s.byCourse.map(x=>`<div class="cpn" style="border-bottom:1px solid var(--line)">
              <div class="grow"><div class="c-code" style="font-size:14px">${esc(x.name)}</div>
                <div class="c-sum">${x.count} inscription${x.count>1?'s':''}</div></div>
              <b class="num" style="color:var(--primary)">${fcfa(x.revenue)}</b>
            </div>`).join('') : `<div style="padding:16px;text-align:center;color:var(--muted);font-size:14px">Aucune vente pour l'instant.</div>`}
          </div>
          <div class="sect" style="padding-left:0">Dernières commandes</div>
          <div class="card">
            ${(ADMIN.recent||[]).length? ADMIN.recent.map(o=>`<div class="cpn" style="border-bottom:1px solid var(--line)">
              <div class="grow"><div class="c-code" style="font-size:13.5px">${o.buyer?esc((o.buyer.prenom||'')+' '+(o.buyer.nom||'')):esc(o.ref)}</div>
                <div class="c-sum">${esc(o.name)}${o.coupon?` · <span style="color:var(--primary)">${esc(o.coupon)}</span>`:''}</div>
                <div class="c-uses">${o.createdAt?ago(o.createdAt):''} · ${esc(o.ref)}</div></div>
              <div style="text-align:right"><b class="num">${fcfa(o.amount)}</b><div>${ordPill(o.status)}</div></div>
            </div>`).join('') : `<div style="padding:16px;text-align:center;color:var(--muted);font-size:14px">Aucune commande.</div>`}
          </div>
          ${s.pending?`<p class="muted" style="font-size:12.5px;text-align:center">${s.pending} commande(s) en attente de confirmation.</p>`:''}
        </div>`;
    }
  }
  return `<div class="screen">${back}${tabs}${panel}
    ${API.mode==='live'?`<div class="px" style="padding-bottom:24px"><button class="btn ghost" onclick="App.adminLogout()">Se déconnecter</button></div>`:''}
  </div>`;
}
function ordPill(st){
  if(st==='paid') return `<span class="pill free">payé</span>`;
  if(st==='failed') return `<span class="pill" style="background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)">échoué</span>`;
  return `<span class="pill paid">en attente</span>`;
}

let flow = null; // {type:'enroll'|'pay', courseId, step, data, ctx}

function enrollSteps(){
  return [
    {key:'prenom', label:'Ton prénom ?', help:'Comme on t\'appelle tous les jours.', ph:'Ex. Awa', type:'text',
     valid:v=>v.trim().length>=2||'Entre au moins 2 lettres.'},
    {key:'nom', label:d=>`Enchanté ${d.prenom} ! Ton nom de famille ?`, help:'Il apparaîtra sur ton certificat.', ph:'Ex. Kouassi', type:'text',
     valid:v=>v.trim().length>=2||'Entre au moins 2 lettres.'},
    {key:'whatsapp', label:'Ton numéro WhatsApp ?', help:'Pour recevoir tes accès et les rappels de cours. Jamais de spam.', ph:'07 00 00 00 00', type:'phone',
     valid:v=>v.replace(/\D/g,'').length>=8||'Ce numéro semble trop court.'},
    {key:'email', label:'Ton adresse e-mail ?', help:'Pour retrouver ton compte et recevoir ton reçu.', ph:'awa@exemple.com', type:'email',
     valid:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())||'Vérifie le format de l\'adresse (ex. nom@gmail.com).'},
  ];
}

function renderFlow(){
  const ov = $('#overlay');
  if(!flow){ ov.innerHTML=''; document.body.style.overflow=''; return; }
  document.body.style.overflow='hidden';
  const c = flow.courseId ? courseById(flow.courseId) : null;

  /* ---- Inscription ---- */
  if(flow.type==='enroll'){
    const steps = enrollSteps();
    const total = steps.length+1; // + récap
    const pct = Math.round(100*(flow.step)/total);
    let inner;
    if(flow.step < steps.length){
      const st = steps[flow.step];
      const label = typeof st.label==='function'?st.label(flow.data):st.label;
      const val = flow.data[st.key]||'';
      let input;
      if(st.type==='phone'){
        input = `<div class="phonerow">
          <select id="fprefix" aria-label="Indicatif pays">${PREFIXES.map(p=>`<option value="${p[0]}" ${(flow.data.prefix||'+225')===p[0]?'selected':''}>${p[0]}</option>`).join('')}</select>
          <input id="finput" class="qinput" type="tel" inputmode="tel" placeholder="${st.ph}" value="${esc(val)}" autocomplete="tel" enterkeyhint="next">
        </div>`;
      } else {
        input = `<input id="finput" class="qinput" type="${st.type}" placeholder="${st.ph}" value="${esc(val)}"
          autocomplete="${st.key==='email'?'email':st.key==='prenom'?'given-name':'family-name'}" enterkeyhint="next">`;
      }
      inner = `
        <div class="qnum">${flow.step+1} ${I.arrowr}</div>
        <h2 class="qlabel">${esc(label)}</h2>
        <p class="qhelp">${esc(st.help)}</p>
        ${input}
        <p class="qerr" id="ferr">${flow.err?esc(flow.err):''}</p>`;
    } else {
      const d = flow.data;
      inner = `
        <div class="qnum">${I.checkc} Dernière étape</div>
        <h2 class="qlabel">Tout est bon ?</h2>
        <p class="qhelp">${c?`Tu t'inscris à « ${esc(c.title)} »${c.price?` — ${fcfa(c.price)}`:' — gratuit'}.`:'Vérifie tes informations avant de créer ton compte.'}</p>
        <div class="recap">
          <div class="row"><span>Prénom</span><b>${esc(d.prenom)}</b></div>
          <div class="row"><span>Nom</span><b>${esc(d.nom)}</b></div>
          <div class="row"><span>WhatsApp</span><b class="num">${esc((d.prefix||'+225')+' '+d.whatsapp)}</b></div>
          <div class="row"><span>E-mail</span><b>${esc(d.email)}</b></div>
        </div>`;
    }
    ov.innerHTML = `<div class="flow" role="dialog" aria-modal="true" aria-label="Inscription">
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="flowhead">
        <button class="iconbtn" onclick="${flow.step>0?'App.flowBack()':'App.flowClose()'}" aria-label="${flow.step>0?'Précédent':'Fermer'}">${flow.step>0?I.back:I.x}</button>
        <span class="muted" style="font-size:13px">${c?esc(c.title):'Créer mon compte'}</span>
        <span style="width:42px"></span>
      </div>
      <div class="flowbody center">${inner}</div>
      <div class="flowfoot">
        <div class="okrow">
          <button class="btn" style="flex:1" onclick="App.flowNext()">
            ${flow.step<steps.length?'OK':'Confirmer mon inscription'} ${flow.step<steps.length?I.check:''}
          </button>
          ${flow.step<steps.length?`<span class="hint">appuie sur <b>Entrée ${'↵'}</b></span>`:''}
        </div>
      </div>
    </div>`;
    const inp = $('#finput');
    if(inp){
      inp.focus();
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); App.flowNext(); } });
    }
    return;
  }

  /* ---- Paiement mobile money ---- */
  if(flow.type==='pay'){
    const STEP_POS = {op:1, confirm:2, redirect:2, wait:3, poll:3, failed:3, done:4};
    const pct = Math.round(100*(STEP_POS[flow.step]||1)/4);
    const amt = (flow.data.amount!=null ? flow.data.amount : (c ? c.price : 0));
    const hasCoupon = !!flow.data.coupon;
    let inner='', foot='';
    if(flow.step==='op'){
      const priceLine = hasCoupon
        ? `<b class="num" style="color:var(--primary)">${fcfa(amt)}</b> <s class="num" style="color:var(--muted);font-weight:500">${fcfa(c.price)}</s> <span class="pill free" style="vertical-align:middle">${esc(flow.data.coupon)}</span>`
        : `<b class="num" style="color:var(--ink)">${fcfa(c.price)}</b>`;
      inner = `
        <h2 class="qlabel">Comment veux-tu payer ?</h2>
        <p class="qhelp">Inscription à « ${esc(c.title)} » — ${priceLine}</p>
        <div class="ops">
          ${OPERATORS.map(o=>`<button class="op ${flow.data.op===o.id?'on':''} ${o.soon?'soon':''}" onclick="App.payPick('${o.id}')" ${o.soon?'aria-disabled="true"':''}>
            <span class="oplogo" style="background:${o.col};${o.dark?'color:#201D19':''}">${o.tag}</span>
            <span><b>${o.name}</b><span>${o.note}</span></span>
            <span class="radio"></span>
          </button>`).join('')}
        </div>
        <div class="coupon">
          <input id="couponInput" type="text" placeholder="Code promo" value="${esc(flow.data.coupon||'')}" autocapitalize="characters" spellcheck="false" aria-label="Code promo" onkeydown="if(event.key==='Enter'){event.preventDefault();App.applyCoupon();}">
          <button class="btn soft" style="width:auto;padding:12px 16px" onclick="App.applyCoupon()">Appliquer</button>
        </div>
        <p class="qerr" id="ferr" ${flow.couponOK?'style="color:var(--primary)"':''}>${flow.err?esc(flow.err):(flow.couponOK?esc(flow.couponOK):'')}</p>`;
      foot = `<button class="btn" ${flow.data.op?'':'disabled'} onclick="App.payNext()">${API.mode==='live'?'Payer avec Wave':'Continuer'} ${I.arrowr}</button>`;
    }
    if(flow.step==='redirect'){
      inner = `<div class="paywait">
        <div class="spinner" aria-hidden="true"></div>
        <h2 class="qlabel" style="font-size:21px">Ouverture de Wave…</h2>
        <p class="qhelp">Tu vas payer <b class="num" style="color:var(--ink)">${fcfa(amt)}</b> en toute sécurité dans Wave. <b>Après le paiement, reviens sur cette page</b> — ton accès s'activera automatiquement.</p>
      </div>`;
      foot = '';
    }
    if(flow.step==='poll'){
      inner = `<div class="paywait">
        <div class="spinner" aria-hidden="true"></div>
        <h2 class="qlabel" style="font-size:21px">Confirmation du paiement…</h2>
        <p class="qhelp">${flow.data.slow
          ? "Wave met un peu plus de temps que d'habitude. Pas d'inquiétude : si tu as payé, ton accès s'activera dès la confirmation. Tu peux rester sur cette page."
          : "On vérifie ton paiement Wave. Cela prend en général quelques secondes — reste sur cette page."}</p>
        <span class="ussd num">${esc(flow.data.ref||'')}</span>
        ${flow.data.slow?`<p class="qhelp" style="margin-top:12px;font-size:13px">Rien ne bouge ? Tu peux relancer la vérification.</p>`:''}
      </div>`;
      foot = flow.data.slow
        ? `<button class="btn soft" onclick="App.payRecheck()">Vérifier à nouveau</button>
           <button class="btn ghost" style="margin-top:9px" onclick="App.flowClose()">Fermer — je reviendrai</button>`
        : '';
    }
    if(flow.step==='failed'){
      inner = `
        <div class="bigcheck" style="background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)">${I.x}</div>
        <h2 class="qlabel" style="text-align:center;margin-top:16px">Paiement non confirmé</h2>
        <p class="qhelp" style="text-align:center">${flow.data.timeout
          ? "On n'a pas encore reçu la confirmation de Wave. Si tu as bien payé, attends quelques instants puis clique « Vérifier à nouveau » — ton accès s'activera sans repayer."
          : "Le paiement a été annulé ou n'a pas abouti. Aucun montant n'a été débité. Tu peux réessayer quand tu veux."}</p>`;
      foot = flow.data.timeout
        ? `<button class="btn" onclick="App.payRecheck()">Vérifier à nouveau</button>
           <button class="btn ghost" style="margin-top:9px" onclick="App.flowClose(true)">Fermer</button>`
        : `<button class="btn" onclick="App.payWaveStart()">Réessayer le paiement</button>
           <button class="btn ghost" style="margin-top:9px" onclick="App.flowClose(true)">Plus tard</button>`;
    }
    if(flow.step==='confirm'){
      const o = OPERATORS.find(x=>x.id===flow.data.op);
      inner = `
        <h2 class="qlabel">Ton numéro ${esc(o.name)} ?</h2>
        <p class="qhelp">Tu recevras une demande de paiement à confirmer avec ton code secret. Ne partage jamais ce code.</p>
        <div class="phonerow">
          <select id="fprefix" aria-label="Indicatif pays">${PREFIXES.map(p=>`<option value="${p[0]}" ${(flow.data.prefix||'+225')===p[0]?'selected':''}>${p[0]}</option>`).join('')}</select>
          <input id="finput" class="qinput" type="tel" inputmode="tel" value="${esc(flow.data.phone||'')}" placeholder="07 00 00 00 00" enterkeyhint="go">
        </div>
        <p class="qerr" id="ferr">${flow.err?esc(flow.err):''}</p>
        <div class="recap"><div class="row"><span>Montant à payer</span><b class="num">${fcfa(amt)}</b></div>${hasCoupon?`<div class="row"><span>Coupon</span><b>${esc(flow.data.coupon)}</b></div>`:''}</div>`;
      foot = `<button class="btn" onclick="App.paySend()">Payer ${fcfa(amt)}</button>`;

    if(flow.step<steps.length){

    if(flow.step<steps.length){

/* ===== Suivi robuste du paiement Wave =====
   Le sondage ne « lâche » jamais tant que l'écran de paiement est ouvert, et il
   REPART tout seul dès que l'app redevient visible (retour depuis l'app Wave ou
   un autre navigateur) — c'est ce qui évite l'écran qui tourne sans fin sur mobile,
   où les navigateurs gèlent les minuteurs des onglets en arrière-plan. */
const PENDING_MAX_AGE = 60*60*1000;   // au-delà d'1 h, on ne relance plus une vieille commande
let payWatch = { ref:null, tries:0, timer:null, busy:false, gen:0 };
function payWatchStop(){ if(payWatch.timer){ clearTimeout(payWatch.timer); payWatch.timer=null; } payWatch.ref=null; payWatch.gen++; }
async function payCheckOnce(){
  const ref = payWatch.ref; if(!ref || payWatch.busy) return false;
  payWatch.busy = true;
  try{
    const r = await fetch('/api/order?ref='+encodeURIComponent(ref), {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j.status==='paid'){ App.onPaid(j); return true; }
      if(j.status==='failed'){ App.onPayFailed(); return true; }
    }
  }catch(e){/* réseau : on réessaiera */}
  finally{ payWatch.busy = false; }
  return false;
}
/* Une seule chaîne de minuteurs à la fois (jeton `gen`) : les événements focus/visibility
   multiples ne créent jamais de sondages parallèles. */
function payWatchTick(gen){
  if(gen!==payWatch.gen || !payWatch.ref) return;
  const ref = payWatch.ref;
  payCheckOnce().then(done=>{
    if(gen!==payWatch.gen) return;
    if(done || payWatch.ref!==ref){ if(done) payWatchStop(); return; }
    payWatch.tries++;
    /* Message rassurant si Wave met du temps — sans jamais déclarer d'échec. */
    if(payWatch.tries===12 && flow && flow.type==='pay' && flow.step==='poll' && !flow.data.slow){ flow.data.slow=true; renderFlow(); }
    const delay = payWatch.tries<20 ? 2000 : 4000;
    payWatch.timer = setTimeout(()=>payWatchTick(gen), delay);
  });
}
function payWatchStart(ref){ if(!ref) return; payWatchStop(); payWatch.ref=ref; payWatch.tries=0; const g=++payWatch.gen; payWatchTick(g); }
/* Reprise immédiate quand l'utilisateur revient dans l'app. */
function payResume(){
  if(document.visibilityState==='hidden') return;
  if(payWatch.ref){                                   // sondage en cours : on revérifie tout de suite
    if(payWatch.timer){ clearTimeout(payWatch.timer); payWatch.timer=null; }
    const g=++payWatch.gen; payWatchTick(g);
  } else if(S.pendingOrder && S.pendingOrder.ref && !S.enrolled[S.pendingOrder.courseId]){
    resumePendingPayment();                           // page restaurée (BFCache) : on relance
  }
}
/* Ouvre/relance l'écran de suivi pour une commande en attente. */
function resumePendingPayment(retFailed){
  const po = S.pendingOrder;
  if(!po || !po.ref) return false;
  if(po.at && Date.now()-po.at > PENDING_MAX_AGE){ delete S.pendingOrder; save(); return false; }
  if(po.courseId && S.enrolled[po.courseId]){ delete S.pendingOrder; save(); return false; }
  if(!flow || flow.type!=='pay' || flow.data.ref!==po.ref){
    flow = {type:'pay', courseId:po.courseId, step: retFailed ? 'failed' : 'poll', data:{op:'wave', ref:po.ref}};
    if(retFailed) flow.data.timeout=true;
    renderFlow();
  }
  if(flow.step==='poll') payWatchStart(po.ref);
  return true;
}
document.addEventListener('visibilitychange', payResume);
window.addEventListener('focus', payResume);
window.addEventListener('pageshow', payResume);   // restauration depuis le cache arrière/avant

/* Retour d'un paiement Wave : success_url/error_url ramènent ici avec ?wave=success|error&ref=…
   On enregistre la référence puis on laisse le suivi robuste faire son travail. */
(function resumeWavePayment(){
  const qs = new URLSearchParams(location.search);
  const ret = qs.get('wave');
  const refUrl = qs.get('ref');
  if(ret || refUrl) history.replaceState(null, '', location.pathname + location.hash);
  const ref = (S.pendingOrder && S.pendingOrder.ref) || refUrl;
  if(!ref) return;                       // rien à reprendre
  if(!S.pendingOrder || S.pendingOrder.ref!==ref) S.pendingOrder = {ref, courseId:(S.pendingOrder&&S.pendingOrder.courseId)||null, at:Date.now()};
  resumePendingPayment(ret==='error');
})();

/* Accès direct à l'espace admin : /boyiaadmin ou #admin */
if(location.pathname.replace(/\/+$/,'')==='/boyiaadmin' || location.hash==='#admin') App.openAdmin();
window.addEventListener('hashchange', ()=>{ if(location.hash==='#admin') App.openAdmin(); });
