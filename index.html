<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boyia Institute — Cours en ligne &amp; communauté</title>
<meta name="description" content="Apprends des compétences pratiques, paie par mobile money, échange avec la communauté.">
<style>
:root{
  --ground:#F4F6FB; --surface:#FFFFFF; --surface-2:#E9EEF8;
  --ink:#1E2A4A; --muted:#5C688A; --line:#DBE2F0;
  --primary:#3D63AE; --primary-deep:#2C4B8C; --primary-soft:#E4EBF8;
  --accent:#DA9A28; --accent-soft:#FAEED2;
  --danger:#C24C3B; --ok:#2E7D57;
  --shadow:0 1px 2px rgba(30,42,74,.07),0 6px 18px rgba(30,42,74,.09);
  --r:16px; --r-sm:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0F1524; --surface:#18213A; --surface-2:#212C4A;
    --ink:#EDF1FB; --muted:#93A1C4; --line:#2A3757;
    --primary:#6E93D6; --primary-deep:#5B84C4; --primary-soft:#1E2A48;
    --accent:#EBB44E; --accent-soft:#33291A;
    --danger:#E0705E; --ok:#4FB488;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1524; --surface:#18213A; --surface-2:#212C4A;
  --ink:#EDF1FB; --muted:#93A1C4; --line:#2A3757;
  --primary:#6E93D6; --primary-deep:#5B84C4; --primary-soft:#1E2A48;
  --accent:#EBB44E; --accent-soft:#33291A;
  --danger:#E0705E; --ok:#4FB488;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --ground:#F4F6FB; --surface:#FFFFFF; --surface-2:#E9EEF8;
  --ink:#1E2A4A; --muted:#5C688A; --line:#DBE2F0;
  --primary:#3D63AE; --primary-deep:#2C4B8C; --primary-soft:#E4EBF8;
  --accent:#DA9A28; --accent-soft:#FAEED2;
  --danger:#C24C3B; --ok:#2E7D57;
  --shadow:0 1px 2px rgba(30,42,74,.07),0 6px 18px rgba(30,42,74,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--ground); color:var(--ink);
  min-height:100dvh; line-height:1.5; font-size:16px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---- App shell ---- */
#shell{max-width:448px;margin:0 auto;min-height:100dvh;position:relative;background:var(--ground);display:flex;flex-direction:column}
@media (min-width:520px){
  body{background:color-mix(in srgb,var(--ground) 60%, var(--surface-2))}
  #shell{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
}
#main{flex:1;padding-bottom:84px}
.screen{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- Bottom nav ---- */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:448px;
  background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;color:var(--muted);font-size:11.5px;font-weight:600;min-height:56px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--primary)}
.tab .dot{position:absolute;display:none}

/* ---- Headers ---- */
.apphead{display:flex;align-items:center;gap:12px;padding:18px 18px 6px}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--primary)}
.logo{display:flex;align-items:center;gap:11px}
.logomark{width:42px;height:44px;flex:none}
.logomark text{font-family:var(--serif);font-weight:700;fill:#fff}
.logo .wm{font-family:var(--serif);line-height:1.02}
.logo .wm b{display:block;font-size:21px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.logo .wm span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--primary);margin-top:3px;font-family:var(--sans)}
.subhead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;position:sticky;top:0;background:var(--ground);z-index:20}
.subhead h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:20px;height:20px}
.tagline{color:var(--muted);font-size:14px;padding:0 18px 4px}

/* ---- Common ---- */
.px{padding-left:14px;padding-right:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--primary);color:#fff;font-weight:700;font-size:16px;
  padding:15px 18px;border-radius:14px;transition:transform .06s ease;
}
:root[data-theme="dark"] .btn{color:#0E1512}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#0E1512} }
.btn:active{transform:scale(.98)}
.btn svg{width:19px;height:19px;flex:none}
.btn.ghost{background:var(--primary-soft);color:var(--primary-deep);border:1.5px solid var(--primary)}
.btn.soft{background:color-mix(in srgb,var(--primary) 14%,var(--surface));color:var(--primary-deep);border:1.5px solid color-mix(in srgb,var(--primary) 34%,transparent);font-weight:700}
.btn.soft[disabled]{opacity:.6}
.btn[disabled]{opacity:.45;pointer-events:none}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.free{background:var(--primary-soft);color:var(--primary)}
.pill.paid{background:var(--accent-soft);color:#9A6A0E}
:root[data-theme="dark"] .pill.paid{color:var(--accent)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pill.paid{color:var(--accent)} }
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);border:0}

/* ---- Search ---- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 14px 0}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{border:0;background:none;flex:1;font-size:15.5px;min-width:0}
.search input:focus{outline:none}
.search input::placeholder{color:var(--muted)}

/* ---- Course cards ---- */
.courselist{display:flex;flex-direction:column;gap:14px;padding:12px 14px 24px}
.ccard{display:block;text-align:left;overflow:hidden;border-radius:var(--r)}
.cover{height:118px;position:relative;display:flex;align-items:flex-end;padding:12px}
.cover .init{
  position:absolute;top:10px;right:14px;font-family:var(--serif);font-weight:700;
  font-size:64px;line-height:1;color:rgba(255,255,255,.28);user-select:none;
}
.cover .pill{background:rgba(255,255,255,.92);color:#201D19}
.cbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:6px}
.ctitle{font-size:16.5px;font-weight:700;line-height:1.3;text-wrap:balance}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--muted)}
.cmeta .star{color:var(--accent);display:inline-flex;align-items:center;gap:3px;font-weight:700}
.cmeta svg{width:13px;height:13px}
.cprice{font-weight:800;font-size:15px}
.cprice.free{color:var(--primary)}

/* ---- Course detail ---- */
.hero{height:170px;display:flex;align-items:flex-end;padding:16px;position:relative}
.hero .init{position:absolute;top:16px;right:20px;font-family:var(--serif);font-weight:700;font-size:96px;line-height:1;color:rgba(255,255,255,.25)}
.dtitle{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.22;text-wrap:balance;padding:16px 18px 4px}
.instr{display:flex;align-items:center;gap:10px;padding:8px 18px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.statrow{display:flex;gap:8px;padding:12px 14px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:15px}
.stat span{font-size:11.5px;color:var(--muted)}
.sect{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 18px 8px}
.learnlist{display:flex;flex-direction:column;gap:9px;padding:0 18px}
.learnlist li{display:flex;gap:10px;list-style:none;font-size:14.5px}
.learnlist svg{width:18px;height:18px;color:var(--primary);flex:none;margin-top:2px}
.modules{display:flex;flex-direction:column;gap:10px;padding:4px 14px 20px}
.module{overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:13px 15px;font-weight:700;font-size:14.5px}
.mhead .n{width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);flex:none}
.lesson{display:flex;align-items:center;gap:11px;padding:12px 15px;border-top:1px solid var(--line);width:100%;text-align:left;font-size:14.5px}
.lesson svg{width:19px;height:19px;color:var(--muted);flex:none}
.lesson.done svg{color:var(--primary)}
.lesson .dur{margin-left:auto;font-size:12.5px;color:var(--muted)}
.ctabar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:448px;z-index:41;
  background:var(--surface);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px;
}
.ctabar .p{flex:none}
.ctabar .p b{font-size:19px}
.ctabar .p span{display:block;font-size:12px;color:var(--muted)}

/* ---- Overlay flows (Tally / paiement) ---- */
.flow{
  position:fixed;inset:0;z-index:60;background:var(--ground);
  display:flex;flex-direction:column;max-width:448px;margin:0 auto;
  animation:slideUp .26s cubic-bezier(.32,.72,.35,1);
}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.progress{height:4px;background:var(--surface-2)}
.progress i{display:block;height:100%;background:var(--primary);border-radius:0 2px 2px 0;transition:width .3s ease}
.flowhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.flowbody{flex:1;overflow-y:auto;padding:8px 22px 20px;display:flex;flex-direction:column}
.flowbody.center{justify-content:center}
.qnum{color:var(--primary);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.qnum svg{width:15px;height:15px}
.qlabel{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.25;text-wrap:balance}
.qhelp{color:var(--muted);font-size:14.5px;margin-top:8px}
.qinput{
  margin-top:22px;width:100%;border:0;border-bottom:2px solid var(--line);background:none;
  font-size:24px;padding:6px 2px 10px;border-radius:0;
}
.qinput:focus{outline:none;border-bottom-color:var(--primary)}
.qinput::placeholder{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.phonerow{display:flex;gap:10px;margin-top:22px;align-items:flex-end}
.phonerow select{
  border:0;border-bottom:2px solid var(--line);background:none;font-size:20px;padding:6px 0 10px;max-width:118px;border-radius:0;
}
.phonerow input{margin-top:0;flex:1}
.qerr{color:var(--danger);font-size:14px;margin-top:10px;min-height:21px}
.flowfoot{padding:10px 22px calc(16px + env(safe-area-inset-bottom))}
.okrow{display:flex;align-items:center;gap:12px}
.okrow .hint{font-size:12.5px;color:var(--muted)}
.recap{margin-top:20px;display:flex;flex-direction:column}
.recap .row{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px}
.recap .row span{color:var(--muted)}
.recap .row b{text-align:right;word-break:break-word}

/* ---- Paiement ---- */
.ops{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.op{display:flex;align-items:center;gap:13px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.op.on{border-color:var(--primary);background:var(--primary-soft)}
.oplogo{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.op b{display:block;font-size:15px}
.op span{font-size:12.5px;color:var(--muted)}
.op .radio{margin-left:auto;width:21px;height:21px;border-radius:50%;border:2px solid var(--line);flex:none}
.op.on .radio{border-color:var(--primary);background:radial-gradient(circle,var(--primary) 45%,transparent 48%)}
.op.soon{opacity:.45}
.op.soon .radio{visibility:hidden}
.coupon{display:flex;gap:8px;margin-top:18px}
.coupon input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.coupon input::placeholder{text-transform:none;letter-spacing:normal;color:var(--muted)}
/* ---- Admin ---- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.k-val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.k-lab{font-size:12px;color:var(--muted)}
.adminwrap{padding:4px 14px 24px;display:flex;flex-direction:column;gap:12px}
.cpn{display:flex;align-items:center;gap:10px;padding:13px 14px}
.cpn .c-code{font-weight:800;font-size:15px;letter-spacing:.04em}
.cpn .c-sum{font-size:12.5px;color:var(--muted)}
.cpn .c-uses{font-size:11.5px;color:var(--muted)}
.cpn .grow{flex:1;min-width:0}
.tgl{width:44px;height:26px;border-radius:999px;background:var(--surface-2);position:relative;flex:none;border:1px solid var(--line)}
.tgl.on{background:var(--primary);border-color:var(--primary)}
.tgl i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s ease}
.tgl.on i{transform:translateX(18px)}
.cpn .del{color:var(--danger);width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cpn .del svg{width:17px;height:17px}
.afield{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.afield input,.afield select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);width:100%;min-width:0}
.arow{display:flex;gap:8px}
.arow .afield{flex:1;min-width:0}
.paywait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:20px 0}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ussd{font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:10px;padding:8px 14px;font-weight:700;letter-spacing:.04em}
.bigcheck{width:76px;height:76px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto}
.bigcheck svg{width:38px;height:38px}
.receipt{margin-top:22px}
.receipt .row{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:1px dashed var(--line);font-size:14px}
.receipt .row:last-child{border-bottom:0}
.receipt .row span{color:var(--muted)}
.demonote{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px;padding:0 10px}

/* ---- Communauté ---- */
.compose{display:flex;gap:11px;margin:10px 14px 0;padding:13px}
.compose .fake{flex:1;display:flex;align-items:center;color:var(--muted);font-size:14.5px;background:var(--surface-2);border-radius:999px;padding:0 16px;min-height:40px}
.feed{display:flex;flex-direction:column;gap:12px;padding:12px 14px 24px}
.post{padding:14px 15px}
.phead{display:flex;align-items:center;gap:10px}
.phead .who b{display:block;font-size:14.5px}
.phead .who span{font-size:12px;color:var(--muted)}
.pcat{margin-left:auto;font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:999px;flex:none}
.ptext{margin-top:10px;font-size:14.8px;white-space:pre-line;word-break:break-word}
.pacts{display:flex;gap:6px;margin-top:11px}
.pact{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:999px;background:var(--surface-2)}
.pact svg{width:16px;height:16px}
.pact.liked{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.leader{margin:10px 14px 0;padding:4px 0}
.leadrow{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--line)}
.leadrow:last-child{border-bottom:0}
.leadrow .rank{width:22px;font-weight:800;color:var(--muted);font-size:14px;text-align:center;flex:none}
.leadrow .rank.top{color:var(--accent)}
.leadrow b{flex:1;font-size:14.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leadrow .pts{font-size:13px;font-weight:700;color:var(--primary)}
.comments{display:flex;flex-direction:column;gap:12px;padding:14px}
.comment{display:flex;gap:10px}
.comment .bub{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:14px;flex:1}
.comment .bub b{display:block;font-size:12.5px;margin-bottom:2px}
.comment .bub span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.cbar{display:flex;gap:9px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:448px;background:var(--surface);border-top:1px solid var(--line);z-index:41}
.cbar input{flex:1;border:1px solid var(--line);background:var(--ground);border-radius:999px;padding:11px 16px;font-size:14.5px;min-width:0}
.cbar button{flex:none;width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
.cbar button svg{width:20px;height:20px}
.composer{padding:14px;display:flex;flex-direction:column;gap:12px}
.composer textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:13px 15px;font-size:15px;resize:vertical}
.catpick{display:flex;gap:8px;flex-wrap:wrap}

/* ---- Mes cours ---- */
.mccard{display:flex;gap:13px;padding:13px;align-items:center;text-align:left;width:100%}
.mccard .thumb{width:62px;height:62px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:26px;color:rgba(255,255,255,.85)}
.mccard .inf{flex:1;min-width:0}
.mccard .inf b{display:block;font-size:14.5px;line-height:1.3}
.pbar{height:6px;background:var(--surface-2);border-radius:3px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.mccard .pct{font-size:12px;color:var(--muted);margin-top:5px;display:block}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 30px;color:var(--muted)}
.empty svg{width:44px;height:44px;opacity:.5}
.empty b{color:var(--ink);font-size:16px}

/* ---- Leçon ---- */
.lplayer{margin:12px 14px 0;border-radius:var(--r);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden}
.lplayer .playbtn{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.5)}
.lplayer .playbtn svg{width:26px;height:26px;margin-left:3px}
.lcontent{padding:16px 18px;font-size:15.5px;display:flex;flex-direction:column;gap:13px}
.lcontent h2{font-family:var(--serif);font-size:21px;line-height:1.25;text-wrap:balance}
.lcontent p{max-width:65ch}
.lcontent .muted svg{width:15px;height:15px;flex:none}
.exo{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:12px;padding:12px 15px;font-size:14.5px;line-height:1.55}
.ytnote{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12.5px;margin:8px 14px 0}
.ytnote svg{width:14px;height:14px}
a.lplayer{text-decoration:none;cursor:pointer}

/* ---- Profil ---- */
.pcard{margin:12px 14px 0;padding:20px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.pcard .avatar{width:66px;height:66px;font-size:24px;margin-bottom:6px}
.pcard h2{font-size:19px}
.pstats{display:flex;gap:8px;margin:12px 14px 0}
.prow{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.prow:last-child{border-bottom:0}
.prow svg{width:20px;height:20px;color:var(--muted);flex:none}
.prow .val{margin-left:auto;color:var(--muted);font-size:13.5px}
.prow.danger,.prow.danger svg{color:var(--danger)}

/* ---- Toast ---- */
#toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--ground);padding:11px 20px;border-radius:999px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s ease;z-index:80;
  max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

   learn:["Expliquer l'IA avec des mots simples","Savoir ce que l'IA sait faire (et pas faire)","Découvrir ChatGPT en pratique","Choisir ta prochaine étape (ChatGPT, Claude ou Copilot)"],
   modules:[
     {t:"C'est quoi l'IA ?", l:[
       ["L'intelligence artificielle expliquée simplement",'2 min',
`Commence par cette vidéo très courte : elle explique l'idée de base de l'intelligence artificielle avec des mots de tous les jours.

Retiens une chose : une IA ne « pense » pas comme un humain. Elle a appris à partir d'énormes quantités d'exemples, et elle s'en sert pour produire une réponse probable. C'est pour ça qu'elle est très forte pour écrire, résumer et proposer des idées — et qu'il faut vérifier quand elle donne un fait précis.

À toi de jouer : après la vidéo, explique l'IA en une phrase à un proche. Si ta phrase est claire pour lui, tu as compris l'essentiel.`,'ourd-ZeOl78'],
       ["IA, ChatGPT, IA générative : les mots à connaître",'4 min',
`Trois mots reviennent partout, mets-les au clair une fois pour toutes.

**Intelligence artificielle (IA)** : un programme capable de réaliser des tâches qui demandaient jusqu'ici l'intelligence humaine (comprendre un texte, reconnaître une image, répondre à une question).

**IA générative** : la famille d'IA qui **crée** du contenu — du texte, des images, du son — à partir d'une demande écrite. C'est elle qui a tout changé depuis 2023.

**ChatGPT, Claude, Copilot, Gemini…** : ce sont des **assistants** construits sur des IA génératives. Même principe pour tous : tu écris une demande en langage normal, l'assistant répond. Si tu sais en utiliser un, tu sais utiliser les autres.

À toi de jouer : note ces 3 définitions dans ton téléphone. Ce vocabulaire te servira dans toutes les leçons suivantes.`,null],
     ]},
     {t:"Vois l'IA en action", l:[
       ["Découvre ChatGPT, pas à pas",'15 min',
`Cette vidéo te montre concrètement ChatGPT : créer un compte, écrire une première demande, comprendre la réponse. Regarde-la en entier, c'est la meilleure façon de « voir » ce que l'IA peut faire.

Pendant que tu regardes, note deux ou trois idées d'usage qui correspondent à TON quotidien : un type d'e-mail, un document à résumer, une liste à organiser.

À toi de jouer : crée ton compte (gratuit) sur chat.openai.com ou claude.ai, et envoie ta toute première demande — par exemple : « Rédige un message poli pour prévenir un client d'un léger retard de livraison. »`,'WPRgJso2Z-k'],
       ["Les bons réflexes dès le début",'10 min',
`Cette vidéo va plus loin : comment formuler tes demandes pour obtenir de bien meilleures réponses. C'est LA compétence qui sépare ceux qui trouvent l'IA « gadget » de ceux qui gagnent une heure par jour.

Le principe à retenir : donne toujours **la tâche + le contexte + le format attendu**. « Rédige une relance (tâche) pour un devis envoyé il y a 5 jours à M. Koné (contexte), en 5 lignes, ton courtois (format). »

À toi de jouer : reformule une demande que tu as déjà faite en ajoutant le contexte et le format. Compare les deux réponses.`,'1c4N_hp21Ns'],
     ]},
     {t:'Et au travail ?', l:[
       ["Là où l'IA t'aide vraiment au bureau",'5 min',
`Au travail, l'IA générative excelle sur cinq familles de tâches. Vérifie lesquelles existent dans ta semaine :

**Écrire** : e-mails, notes, annonces, comptes rendus — l'IA fait le premier jet, tu ajustes. **Résumer** : longs documents, fils d'e-mails, notes de réunion — l'essentiel en quelques lignes. **Organiser** : transformer des idées en vrac en plan, liste ou tableau. **Traduire et corriger** : messages en anglais, textes sans fautes. **Réfléchir** : demander 10 idées, comparer des options, préparer des questions.

Ce que l'IA ne fait pas : connaître ton entreprise mieux que toi, garantir un fait précis, décider à ta place. Elle **accélère**, tu **diriges**.

À toi de jouer : dans ta semaine type, identifie 2 tâches « écrire », 1 tâche « résumer » et 1 tâche « organiser ». Ce sont tes premiers chantiers IA.`,null],
       ["Ta suite : ChatGPT, Claude ou Copilot ?",'4 min',
`Tu as les bases. Pour passer au niveau « je m'en sers tous les jours au travail », choisis ton outil selon ta situation :

**ChatGPT au travail** : le plus polyvalent, parfait pour commencer — e-mails, résumés, tableaux, idées. **Claude au travail** : imbattable sur les documents longs, l'analyse de rapports et le ton juste des messages délicats. **Copilot au travail** : si ton entreprise utilise Word, Excel, Outlook et Teams, c'est l'IA directement dans tes outils.

Chaque cours dure environ 2 h, en leçons de 7 à 10 minutes, avec des exemples de vrai travail et un exercice à chaque leçon.

À toi de jouer : inscris-toi au cours qui correspond à ta situation, et présente-toi dans la communauté : dis-nous quel outil tu as choisi et pourquoi.`,null],
     ]},

  /* ---------- PAYANT · IA · ChatGPT ---------- */
  {id:'chatgpt', title:'ChatGPT au travail : gagner du temps chaque jour', cat:'IA', price:5000, g:1,

   learn:["Accéder à ChatGPT et faire ta première demande utile","Écrire des consignes claires qui donnent de bons résultats","Gagner du temps sur tes e-mails, résumés et documents","Vérifier les réponses et protéger les infos confidentielles","Repartir avec 10 consignes + un pack e-mails à copier-coller","Suivre un plan de 7 jours pour en faire un réflexe quotidien"],
   modules:[
     {t:'Prendre ChatGPT en main', l:[
       ["C'est quoi ChatGPT, en une phrase",'7 min',
`ChatGPT est un assistant qui écrit et réfléchit avec toi, à partir de tes demandes en langage normal. Tu lui écris comme tu écrirais à un collègue serviable, et il te répond : un e-mail rédigé, un texte résumé, une liste d'idées, un tableau, une explication.

Ce n'est pas un moteur de recherche : il ne « cherche » pas une page, il **compose** une réponse en s'appuyant sur ce qu'il a appris. Conséquence importante : il est excellent pour rédiger, reformuler, organiser et expliquer, mais il peut se tromper sur des faits précis (on verra comment vérifier au module 4).

Retiens l'idée clé : ChatGPT fait gagner du temps sur tout ce qui est **écrire, résumer, structurer et trouver des idées**.

À toi de jouer : en une phrase, note une tâche écrite qui te prend du temps chaque semaine (un type d'e-mail, un compte rendu…). C'est ce qu'on va accélérer.`,null],
       ["Y accéder : gratuit ou payant",'8 min',
`Va sur chat.openai.com ou installe l'application mobile ChatGPT, puis crée un compte avec ton e-mail.

La **version gratuite** suffit largement pour apprendre et pour la plupart des tâches de bureau. La **version payante** (abonnement mensuel) donne accès aux modèles les plus récents, à des limites plus hautes et à des fonctions avancées (analyse de fichiers, image, voix).

Conseil : commence en gratuit, passe au payant seulement si tu l'utilises tous les jours et que les limites te gênent. Sur mobile comme sur ordinateur, l'usage est le même : une zone de saisie en bas, la conversation au-dessus.

À toi de jouer : crée ton compte et ouvre une nouvelle conversation. Tu es prêt pour la suite.`,null],
       ["L'interface en 2 minutes",'6 min',
`Tu n'as besoin que de trois choses.

**La zone de message** en bas : tu y écris ta demande et tu envoies. **La conversation** au centre : tes messages et les réponses s'empilent ; tu peux continuer à discuter, ChatGPT se souvient de ce qui précède dans la même conversation. **Le bouton « Nouvelle conversation »** : ouvre-le pour changer de sujet, sinon tout se mélange.

Astuce : garde une conversation par grand sujet (ex. « E-mails clients », « Compte rendu hebdo ») pour t'y retrouver. Tu peux relire, copier une réponse, ou demander « refais plus court ».

À toi de jouer : ouvre une nouvelle conversation et écris simplement « Bonjour, peux-tu m'aider à rédiger des e-mails professionnels ? ». Observe la réponse.`,null],
       ["Ta première demande utile",'9 min',
`Ne commence pas par une question vague. Donne une **vraie petite tâche**. Exemple : « Rédige un e-mail court et poli pour demander à un fournisseur la date de livraison d'une commande passée lundi. » Tu obtiens un e-mail prêt à ajuster.

Si le résultat n'est pas parfait, tu **continues la conversation** : « Rends-le plus court », « Ajoute que c'est urgent mais reste courtois », « Mets-le en français plus simple ». C'est cet aller-retour qui fait toute la puissance de l'outil. Tu n'as pas à réussir du premier coup.

À toi de jouer : demande à ChatGPT de rédiger un e-mail réel dont tu as besoin cette semaine, puis demande-lui une version plus courte.`,null],
     ]},
     {t:'Bien demander : la compétence clé', l:[
       ["La recette d'une bonne consigne",'10 min',
`Une bonne demande tient en quatre morceaux : **rôle + tâche + contexte + format**.

**Rôle** : « Tu es un assistant commercial. » **Tâche** : « Rédige une relance. » **Contexte** : « Le client n'a pas répondu à mon devis envoyé il y a 5 jours, il s'appelle M. Koné, montant 150 000 FCFA. » **Format** : « E-mail de 6 lignes maximum, ton cordial. »

Plus tu donnes de contexte utile, meilleure est la réponse. La différence entre un résultat moyen et un résultat excellent, c'est presque toujours le **contexte** que tu ajoutes.

À toi de jouer : reprends ta tâche du module 1 et réécris ta demande avec les 4 morceaux (rôle, tâche, contexte, format).`,null],
       ["Donner un exemple pour guider le style",'8 min',
`Le moyen le plus rapide d'obtenir le bon ton, c'est de **montrer un exemple**.

Colle un e-mail que tu as déjà écrit et dont tu es content, puis dis : « Écris dans le même style que cet exemple. » ChatGPT copie la structure, la longueur et le ton. Tu peux aussi dire « Comme ceci, mais en plus formel » ou « en plus chaleureux ».

C'est très utile pour garder la voix de ton entreprise sur tous tes messages.

À toi de jouer : colle un de tes anciens e-mails et demande un nouveau message « dans le même style » pour une autre situation.`,null],
       ["Corriger et itérer",'8 min',
`Considère la première réponse comme un **brouillon**, pas comme un résultat final.

Tu l'améliores par petites instructions : « Plus court », « Plus simple », « Enlève le jargon », « Ajoute une formule de politesse locale », « Propose 3 versions au choix ». Itérer coûte quelques secondes et transforme une réponse correcte en réponse parfaite.

La plupart des débutants abandonnent après la première réponse : ne fais pas cette erreur, c'est dans l'aller-retour que se trouve la qualité.

À toi de jouer : prends une réponse « correcte » et améliore-la en 3 instructions successives.`,null],
       ["Régler le ton et la longueur",'7 min',
`Sois explicite sur ce que tu veux : **longueur** (« en 5 lignes », « un paragraphe », « une page »), **ton** (« formel », « amical », « direct »), et **public** (« pour un directeur », « pour un client mécontent », « pour un collègue »).

Tu peux même demander « en français simple, phrases courtes ». Ces réglages évitent les textes trop longs ou trop rigides et te font gagner un temps précieux de relecture.

À toi de jouer : demande le même message en deux tons différents (formel puis amical) et compare.`,null],
     ]},
     {t:'Cas d\'usage réels au travail', l:[
       ["E-mails : rédiger et répondre",'10 min',
`C'est l'usage numéro un au bureau.

Pour **rédiger** : donne l'objectif et le contexte, ChatGPT écrit. Pour **répondre** : colle l'e-mail reçu et dis « Rédige une réponse qui accepte la réunion mais propose jeudi plutôt que mercredi, ton courtois ». Pour les messages délicats (refus, retard, réclamation), demande « une version diplomate qui garde une bonne relation ».

Tu relis, tu ajustes un détail, tu envoies. Un e-mail qui te prenait 15 minutes en prend 3.

À toi de jouer : colle un vrai e-mail reçu et fais rédiger une réponse, puis corrige un détail avant de l'utiliser.`,null],
       ["Résumer un document ou une réunion",'9 min',
`Colle un long texte (compte rendu, article, message) et demande : « Résume en 5 points l'essentiel » ou « Donne-moi les décisions et qui fait quoi ».

Pour une réunion, colle tes notes brutes et demande « un compte rendu clair avec les actions à faire ». Tu peux préciser le public : « pour envoyer à l'équipe » ou « pour ma direction, en 3 lignes ».

Le résumé te fait gagner un temps considérable et t'évite de rater une information importante.

À toi de jouer : colle un long message ou tes notes d'une réunion et demande un résumé en 5 points avec les actions à faire.`,null],
       ["Créer une liste, un tableau, un plan",'9 min',
`ChatGPT structure très bien l'information.

Demande « Fais-moi un tableau à 3 colonnes : tâche, responsable, échéance » ou « Transforme ce paragraphe en liste à puces » ou « Propose un plan en 5 parties pour cette présentation ». Tu peux copier le tableau dans Word, Excel ou un e-mail.

C'est parfait pour passer d'idées en vrac à un document propre et organisé.

À toi de jouer : donne 6 tâches en vrac et demande un tableau tâche / responsable / échéance.`,null],
       ["Préparer une présentation ou une prise de parole",'8 min',
`Décris ton sujet et ton public : « Prépare le plan d'une présentation de 10 minutes sur nos résultats du trimestre, pour l'équipe commerciale, avec 5 diapositives et 3 points par diapositive. » Tu obtiens une trame que tu remplis.

Tu peux aussi demander « les 3 messages à retenir » ou « une phrase d'accroche pour commencer ». Idéal pour ne plus jamais partir de la page blanche.

À toi de jouer : fais préparer le plan d'une présentation que tu dois vraiment faire bientôt.`,null],
       ["Traduire et corriger",'7 min',
`Colle un texte et demande « Traduis en anglais professionnel » ou « Corrige les fautes et améliore le style, sans changer le sens ».

Très utile pour écrire à un client étranger, ou pour relire un document important avant de l'envoyer. Demande toujours de **garder le sens** et, pour les documents sensibles, relis la traduction (voir module 4).

À toi de jouer : fais corriger un texte que tu as écrit, puis demande une version traduite en anglais.`,null],
     ]},
     {t:'Fiable et responsable', l:[
       ["L'IA peut se tromper : toujours vérifier",'9 min',
`ChatGPT peut énoncer une information fausse avec assurance (on appelle ça une « hallucination »). Il ne faut donc jamais utiliser un **chiffre, une date, une loi, un nom ou une citation** sans les vérifier à la source.

Règle simple : l'IA est fiable pour la **forme** (rédiger, reformuler, organiser) et à surveiller sur le **fond** (les faits précis). Pour un document important, garde le réflexe : je fais rédiger par l'IA, je vérifie les faits moi-même.

À toi de jouer : repère dans une réponse un élément factuel (chiffre, date) et vérifie-le à la source avant de t'en servir.`,null],
       ["Confidentialité : ce qu'on ne colle jamais",'9 min',
`Ne colle pas d'informations **confidentielles ou personnelles** que ton entreprise ne voudrait pas voir sortir : mots de passe, données bancaires, numéros de clients, contrats sensibles, dossiers médicaux. Considère que ce que tu écris peut être utilisé pour améliorer le service.

Astuce pro : **anonymise** avant de coller (remplace les vrais noms et montants par « Client A », « X FCFA »), puis remets les vraies valeurs dans le résultat.

En cas de doute, demande-toi : « serais-je à l'aise si un tiers le lisait ? »

À toi de jouer : reprends une demande contenant des infos sensibles et réécris-la en version anonymisée.`,null],
       ["Respecter la politique de ton entreprise",'7 min',
`Beaucoup d'organisations ont des règles sur l'usage de l'IA : outils autorisés, types de données interdits, obligation de relire. Renseigne-toi avant d'utiliser ChatGPT au travail, et respecte ces règles.

Utiliser l'IA intelligemment, c'est aussi savoir **quand ne pas l'utiliser** — par exemple pour une décision qui engage la responsabilité de l'entreprise sans relecture humaine.

À toi de jouer : liste 2 tâches où tu peux utiliser l'IA librement, et 1 tâche où tu dois d'abord demander l'accord.`,null],
       ["Prendre de bonnes habitudes",'8 min',
`Pour progresser vite : garde tes **meilleures consignes** dans un fichier (tu les réutilises), travaille par **conversations thématiques**, relis toujours avant d'envoyer, et considère l'IA comme un assistant que tu diriges — pas comme une autorité.

Fixe-toi un objectif simple cette semaine : automatiser **une** tâche écrite récurrente. La régularité, pas la perfection, fait la différence.

À toi de jouer : choisis une tâche à automatiser cette semaine et note la consigne qui marche le mieux pour la réutiliser.`,null],
     ]},
     {t:'Ta boîte à outils (à copier-coller)', l:[
       ["10 consignes prêtes à copier",'12 min',
`Voici ta bibliothèque de départ. Copie ces consignes dans le bloc-notes de ton téléphone, remplace ce qui est entre [crochets], colle dans ChatGPT. Elles couvrent l'essentiel d'une semaine de bureau.

**1. Répondre à un e-mail** : « Voici un e-mail que j'ai reçu : [colle l'e-mail]. Rédige une réponse qui [accepte / refuse / demande un délai], ton courtois et professionnel, 6 lignes maximum. »

**2. Relancer sans fâcher** : « Rédige une relance polie pour [un devis / une facture / un dossier] envoyé le [date] à [nom], sans réponse à ce jour. Ton cordial mais clair, avec une question simple à la fin. »

**3. Compte rendu express** : « Voici mes notes de réunion en vrac : [colle tes notes]. Transforme-les en compte rendu : contexte en 2 lignes, décisions, actions avec responsable et échéance. »

**4. Annonce à l'équipe** : « Rédige un message pour annoncer [le changement] à l'équipe. Explique la raison en une phrase, ce qui change concrètement, et termine sur une note positive. 8 lignes max. »

**5. Tableau de suivi** : « Transforme cette liste en tableau à 4 colonnes (tâche, responsable, échéance, statut) : [colle ta liste]. »

**6. Message difficile** : « Je dois annoncer [la mauvaise nouvelle] à [client / collègue / chef]. Rédige 2 versions : une directe, une diplomate. Les deux doivent préserver la relation. »

**7. Traduction professionnelle** : « Traduis en anglais professionnel, sans changer le sens : [colle le texte]. Puis donne une version plus simple si mon interlocuteur n'est pas anglophone natif. »

**8. Générer des idées** : « Donne-moi 10 idées de [promotion / nom / sujet de publication] pour [ton activité]. Public : [décris tes clients]. Classe-les de la plus simple à la plus ambitieuse. »

**9. Préparer une présentation** : « Prépare le plan d'une présentation de [10] minutes sur [sujet] pour [public]. 5 parties, 3 points par partie, plus une phrase d'accroche pour commencer. »

**10. Améliorer un texte** : « Corrige les fautes et améliore ce texte sans changer le sens ni le ton : [colle ton texte]. Puis liste en 3 points ce que tu as changé. »

À toi de jouer : copie ces 10 consignes dans ton téléphone maintenant, et utilises-en une vraie aujourd'hui.`,null],
       ["Ton pack e-mails : les 5 situations qui reviennent toujours",'10 min',
`Au bureau, 5 situations d'e-mail reviennent sans arrêt. Prépare une consigne pour chacune une bonne fois, et tu ne repartiras plus jamais de zéro.

**Demander (info, prix, délai)** : « Rédige un e-mail court pour demander [quoi] à [qui], en donnant le contexte en une phrase. Termine par une question précise et une formule polie. »

**Confirmer (commande, rendez-vous, accord)** : « Rédige un e-mail qui confirme [quoi], reprend les points convenus ([liste-les]) et précise la prochaine étape. »

**S'excuser (retard, erreur)** : « Rédige un e-mail qui reconnaît [le problème] sans se justifier à l'excès, présente des excuses sincères, et propose [la solution]. Ton professionnel, pas dramatique. »

**Refuser en gardant la relation** : « Rédige un refus de [la demande] : remercie, explique la raison en une phrase honnête, propose une alternative si possible. Le lecteur doit se sentir respecté. »

**Remercier / féliciter** : « Rédige un message de remerciement pour [quoi], chaleureux mais professionnel, 4 lignes, sans exagération. »

Astuce de pro : après chaque bon résultat, colle l'e-mail final sous ta consigne dans ton fichier. La prochaine fois, tu donnes les deux à ChatGPT : « même style que cet exemple ». La qualité devient constante.

À toi de jouer : identifie la situation qui revient le plus dans TA semaine et prépare ta consigne personnalisée dès maintenant.`,null],
       ["Ton plan d'action : 7 jours pour en faire un réflexe",'10 min',
`Tu as la méthode et la boîte à outils. Voici comment les transformer en réflexe quotidien — c'est ce qui change vraiment ta semaine de travail.

**Jour 1** : réponds à 2 vrais e-mails avec la consigne n°1. Chronomètre : note le temps gagné. **Jour 2** : fais rédiger une relance ou une demande réelle (consignes 2 ou du pack). **Jour 3** : transforme tes notes (réunion, idées) en compte rendu ou tableau (consignes 3 et 5). **Jour 4** : traite un message difficile ou une annonce (consignes 4 ou 6) — compare les 2 versions proposées. **Jour 5** : prépare un document plus gros : présentation, texte long à améliorer (consignes 9 et 10). **Jours 6-7** : bilan — quelles consignes t'ont servi ? Mets à jour ton fichier, supprime ce qui ne sert pas, garde tes 5 gagnantes.

**Mesure tes gains** : note chaque jour le temps gagné (même approximatif). La plupart des apprenants gagnent 30 à 60 minutes par jour dès la première semaine — c'est ta preuve pour continuer, et un excellent argument auprès de ton équipe.

**Ensuite** : chaque nouvelle tâche écrite qui te prend plus de 10 minutes, demande-toi d'abord : « ChatGPT peut-il faire le premier jet ? » La réponse est presque toujours oui.

À toi de jouer : ouvre ton agenda et bloque 15 minutes par jour cette semaine, intitulées « ChatGPT au travail ». Puis viens partager ton temps gagné dans la communauté (Victoires) — ça motive tout le monde.`,null],
     ]},
   ]},

  /* ---------- PAYANT · IA · Claude ---------- */
  {id:'claude', title:"Claude au travail : rédiger et analyser comme un pro", cat:'IA', price:5000, g:3,
   instr:'Équipe Boyia Institute', instrRole:'Formation IA pour le travail', dur:'2 h 50',
   desc:"Claude excelle sur les textes longs, l'analyse de documents et le ton juste. Fais-en ton assistant pour les documents pros, les rapports et l'analyse.",
   learn:["Accéder à Claude et comprendre ses points forts","Faire analyser et résumer de longs documents","Produire des documents professionnels soignés (Artifacts)","Travailler en confiance : confidentialité et vérification","Repartir avec 10 consignes + 4 modèles de documents réutilisables","Suivre un plan de 7 jours pour en faire un réflexe quotidien"],
   modules:[
     {t:'Prendre Claude en main', l:[
       ["C'est quoi Claude, et ses points forts",'8 min',
`Claude est un assistant IA conçu par Anthropic. Comme les autres, tu lui écris en langage normal et il te répond.

Sa réputation : il est particulièrement bon pour les **textes longs**, l'**analyse de documents**, la **nuance** et un **ton naturel et professionnel**. Concrètement, si tu dois lire un rapport de 20 pages, rédiger une note soignée, ou reformuler un message délicat avec le bon équilibre, Claude est un excellent choix.

Le principe d'usage reste le même que pour tout assistant IA : une bonne demande, du contexte, et des allers-retours.

À toi de jouer : note un document long que tu dois traiter bientôt (rapport, contrat, compte rendu). Ce sera ton terrain d'entraînement.`,null],
       ["Y accéder : gratuit ou payant",'7 min',
`Va sur claude.ai ou installe l'application, et crée un compte.

La **version gratuite** permet déjà beaucoup : discuter, analyser des documents, rédiger. La **version payante** offre des limites plus hautes, les modèles les plus performants et des fonctions avancées comme les **Projets** (regrouper le contexte d'un même sujet de travail).

Commence en gratuit ; passe au payant si tu traites de gros volumes chaque jour. L'interface est épurée : une zone de message, la conversation, et la possibilité de **joindre un fichier**.

À toi de jouer : crée ton compte et repère le bouton pour joindre un fichier (le trombone).`,null],
       ["Joindre un document et poser une question",'8 min',
`Le geste le plus utile avec Claude : **joins un fichier** (PDF, Word, texte, tableau) puis pose ta question dessus.

Exemple : joins un rapport et demande « Résume les 5 points clés et les risques mentionnés » ou « Que dit ce contrat sur les délais de paiement ? ». Claude lit le document et répond en s'appuyant dessus.

C'est beaucoup plus fiable que de lui demander de deviner : tu lui donnes la matière, il l'analyse.

À toi de jouer : joins un document que tu connais bien et demande un résumé en 5 points. Vérifie qu'il a saisi l'essentiel.`,null],
       ["Ta première demande utile",'7 min',
`Commence par une tâche concrète, pas une question vague.

Exemple : « Rédige une note interne d'une demi-page pour annoncer un changement d'horaires à l'équipe, ton clair et rassurant. » Puis affine : « Ajoute une phrase de remerciement », « Rends-le plus bref ».

Comme pour tout assistant, la première réponse est un brouillon que tu améliores par petites touches.

À toi de jouer : fais rédiger une note interne réelle, puis demande une version plus courte.`,null],
     ]},
     {t:'Bien demander : la compétence clé', l:[
       ["La recette d'une bonne consigne",'9 min',
`Structure ta demande : **rôle + tâche + contexte + format**.

Exemple : « Tu es responsable RH (rôle). Rédige un message (tâche) pour féliciter l'équipe après un trimestre difficile mais réussi (contexte). En 8 lignes, ton chaleureux et sincère (format). »

Avec Claude, tu peux donner **beaucoup de contexte** sans problème : il gère très bien les consignes longues et détaillées. Plus le contexte est riche et précis, plus le résultat est juste.

À toi de jouer : écris une consigne complète (4 morceaux) pour un message que tu dois envoyer cette semaine.`,null],
       ["Donner un exemple et régler le ton",'8 min',
`Pour obtenir exactement le bon style, montre un exemple : colle un document dont tu es fier et dis « Écris dans ce style ».

Claude est réputé pour bien **capter la nuance** : tu peux demander « plus diplomate », « plus direct sans être sec », « chaleureux mais professionnel ». C'est précieux pour les messages sensibles (annonce difficile, réponse à une plainte, recadrage bienveillant) où le ton fait tout.

À toi de jouer : fais rédiger un message délicat, puis demande une version « plus diplomate ».`,null],
       ["Itérer sur un long texte",'8 min',
`Sur un document long, travaille **section par section** : « Améliore seulement l'introduction », « Raccourcis la partie 2 de moitié », « Uniformise le ton sur tout le document ».

Tu peux aussi demander « Relis et signale les incohérences » ou « Propose un titre et un résumé exécutif ». Cette approche par morceaux donne un contrôle fin sur le rendu final.

À toi de jouer : prends un texte long et fais améliorer une seule section à la fois.`,null],
     ]},
     {t:'Cas d\'usage réels au travail', l:[
       ["Analyser un long rapport",'10 min',
`Joins un rapport ou un compte rendu volumineux et demande une lecture structurée : « Résume en une page », « Liste les décisions et les actions avec les responsables », « Quels sont les 3 risques principaux et les solutions proposées ? », « Qu'est-ce qui manque ou reste flou ? ».

Claude est particulièrement à l'aise sur ce travail d'analyse. Tu passes de « je dois lire 30 pages » à « j'ai l'essentiel en 2 minutes, et je vérifie les points clés ».

À toi de jouer : joins un long document et demande les décisions, les actions et les risques.`,null],
       ["Produire un document soigné avec les Artifacts",'9 min',
`Quand tu demandes à Claude de créer un vrai document (une note, un tableau, un modèle de lettre, une procédure), il peut l'afficher dans un **Artifact** : un panneau à côté de la conversation où le document prend forme, que tu peux copier ou télécharger.

Demande par exemple « Crée un modèle de compte rendu de réunion réutilisable » ou « Fais un tableau comparatif de ces 3 offres ». Tu obtiens un livrable propre, prêt à réutiliser, que tu fais évoluer par simples instructions.

À toi de jouer : demande un modèle réutilisable (compte rendu, e-mail type, checklist) et adapte-le à ton équipe.`,null],
       ["Rédiger des e-mails et messages justes",'8 min',
`Comme tout assistant IA, Claude rédige et répond aux e-mails. Sa force : le **ton naturel**.

Colle un e-mail reçu et demande « une réponse ferme mais courtoise qui refuse la remise sans casser la relation ». Pour un message d'équipe, demande « chaleureux et motivant, sans en faire trop ». Tu relis, tu ajustes, tu envoies.

À toi de jouer : fais rédiger une réponse à un e-mail difficile en gardant une bonne relation.`,null],
       ["Traduire et adapter au public",'7 min',
`Demande « Traduis en anglais professionnel » ou « Adapte ce message pour un public non spécialiste ».

Claude gère bien les registres : tu peux demander « garde le sens exact mais rends-le accessible à quelqu'un qui ne connaît pas le sujet ». Utile pour communiquer avec des clients étrangers ou vulgariser un sujet technique.

À toi de jouer : fais adapter un texte technique « pour un public non spécialiste ».`,null],
     ]},
     {t:'Fiable et responsable', l:[
       ["Vérifier les faits",'8 min',
`Comme toute IA, Claude peut se tromper sur un fait précis. Quand il analyse un **document que tu as fourni**, il est plus fiable car il s'appuie sur ta matière — mais vérifie quand même les chiffres et citations importants dans la source.

Pour tout ce qui engage (montant, date, clause d'un contrat), relis toi-même le passage d'origine. L'IA t'aide à lire vite ; la décision reste la tienne.

À toi de jouer : après un résumé, retrouve dans le document d'origine un chiffre cité et vérifie-le.`,null],
       ["Confidentialité et données",'9 min',
`Ne joins pas de documents contenant des données que ton organisation veut garder privées sans en avoir le droit : données personnelles de clients, contrats confidentiels, dossiers sensibles. Renseigne-toi sur ce qui est autorisé chez toi.

Bonne pratique : **anonymise** les noms et montants sensibles avant d'analyser, puis réintègre les vraies valeurs dans le livrable final. En cas de doute, abstiens-toi et demande à ton responsable.

À toi de jouer : prépare une version anonymisée d'un document avant de l'analyser.`,null],
       ["Esprit critique et bonnes habitudes",'8 min',
`Respecte les règles de ton organisation sur l'IA (outils permis, données interdites, relecture obligatoire). Et garde ton esprit critique : l'IA propose, tu décides. Pour un livrable qui sort de l'entreprise (offre, contrat, communication officielle), la relecture humaine est indispensable.

Pour progresser : garde tes meilleures consignes, travaille par conversations thématiques, exploite les Artifacts pour tes documents réutilisables. Objectif de la semaine : traiter **un** document long avec Claude et gagner une heure.

À toi de jouer : choisis un document long récurrent et crée le modèle qui te fera gagner du temps à chaque fois.`,null],
     ]},
     {t:'Ta boîte à outils (à copier-coller)', l:[
       ["10 consignes prêtes à copier (documents et analyse)",'12 min',
`Ta bibliothèque de départ, spécialisée documents et analyse — le terrain où Claude excelle. Copie-la dans ton téléphone, remplace les [crochets], joins ton document quand c'est indiqué.

**1. Lire un rapport à ta place** : joins le document + « Résume ce rapport en une page : contexte, points clés, chiffres importants, conclusion. Puis liste ce qui reste flou ou manquant. »

**2. Décisions et actions** : joins le compte rendu + « Extrais les décisions prises et les actions à faire, sous forme de tableau : action, responsable, échéance. »

**3. Lire un contrat** : joins le contrat + « Que dit ce document sur [les délais de paiement / la résiliation / les pénalités] ? Cite le passage exact à chaque fois. »

**4. Synthèse pour la direction** : joins le document + « Prépare une synthèse en 5 lignes pour un directeur pressé : la situation, le chiffre clé, la recommandation. »

**5. Comparer des offres** : joins les documents + « Compare ces offres dans un tableau : prix, délais, garanties, risques. Termine par une recommandation argumentée en 3 lignes. »

**6. Note interne soignée** : « Rédige une note interne d'une demi-page pour annoncer [le sujet] : contexte, ce qui change, calendrier, qui contacter. Ton clair et rassurant. »

**7. Procédure réutilisable** : « Crée une procédure étape par étape pour [la tâche], compréhensible par un nouveau collègue : prérequis, étapes numérotées, erreurs fréquentes à éviter. »

**8. Réponse à une plainte** : « Voici la plainte reçue : [colle le message]. Rédige une réponse qui reconnaît le problème, garde un ton respectueux, et propose [la solution], sans promettre l'impossible. »

**9. Préparer une réunion** : joins le dossier + « Prépare-moi pour cette réunion : les 3 points essentiels du dossier, les questions qu'on risque de me poser (avec des éléments de réponse), et les 2 questions que je devrais poser. »

**10. Améliorer un long texte** : joins ton texte + « Relis ce document : signale les incohérences, propose un meilleur titre, et améliore l'introduction et la conclusion sans changer le fond. »

À toi de jouer : copie ces 10 consignes maintenant, et utilise la n°1 ou la n°2 sur un vrai document aujourd'hui.`,null],
       ["4 modèles à générer une fois, réutiliser pour toujours",'10 min',
`La force des Artifacts : tu fais créer un modèle une fois, tu le gardes, tu le réutilises chaque semaine. Voici les 4 modèles qui servent dans presque tous les métiers — demande-les à Claude tels quels.

**Modèle de compte rendu** : « Crée un modèle de compte rendu de réunion réutilisable : en-tête (date, participants, objet), points discutés, décisions, tableau des actions (qui / quoi / quand), points reportés. Format sobre et professionnel. »

**Modèle de note interne** : « Crée un modèle de note interne : objet, contexte en 2 lignes, corps structuré, prochaines étapes, contact. Avec des instructions entre crochets pour me guider à chaque section. »

**Checklist qualité avant envoi** : « Crée une checklist de relecture avant d'envoyer un document important : orthographe, chiffres vérifiés, destinataires, pièces jointes, ton, mentions confidentielles. Format à cocher. »

**Tableau de bord hebdo** : « Crée un modèle de point hebdomadaire : ce qui a avancé, ce qui bloque, priorités de la semaine suivante, indicateurs clés. Une page maximum. »

Garde ces modèles dans un dossier (ou un Projet Claude si tu as la version payante). Chaque fois que tu en utilises un, tu pars d'une structure prête au lieu d'une page blanche : 20 minutes gagnées à chaque document.

À toi de jouer : fais générer le modèle qui te servira le plus, adapte-le à ton équipe, et range-le dans ton dossier « Modèles ».`,null],
       ["Ton plan d'action : 7 jours pour en faire un réflexe",'10 min',
`Une semaine pour installer l'habitude — objectif : plus jamais lire 30 pages sans aide, plus jamais partir d'une page blanche.

**Jour 1** : joins un vrai document long (rapport, contrat) et utilise les consignes 1 et 3. Note le temps gagné. **Jour 2** : fais extraire décisions et actions d'un compte rendu (consigne 2), envoie le résultat à ton équipe. **Jour 3** : génère ton premier modèle réutilisable (leçon précédente). **Jour 4** : traite un message délicat (consigne 8) ou une synthèse direction (consigne 4). **Jour 5** : prépare une vraie réunion avec la consigne 9 — tu verras la différence en séance. **Jours 6-7** : bilan — mets à jour ton fichier de consignes, garde tes gagnantes, génère un deuxième modèle.

**Règle d'or à retenir** : tout document que tu fournis à Claude rend sa réponse plus fiable. Joins toujours ta matière (document, notes, exemple) plutôt que de le laisser deviner — et vérifie les chiffres cités dans la source avant de t'en servir.

**Ensuite** : chaque document de plus de 5 pages qui arrive, réflexe « Claude d'abord » : résumé, points clés, risques. Tu lis ensuite en connaissance de cause, deux fois plus vite.

À toi de jouer : bloque 15 minutes par jour cette semaine dans ton agenda, intitulées « Claude au travail ». Et partage ta première victoire dans la communauté — un document de 20 pages lu en 3 minutes, ça inspire.`,null],

   learn:["Comprendre où se trouve Copilot dans Microsoft 365","Rédiger dans Word et reprendre le contrôle d'Outlook","Analyser des données et créer des tableaux dans Excel","Résumer une réunion Teams, monter une présentation PowerPoint","Repartir avec des consignes prêtes à copier, appli par appli","Installer une routine quotidienne qui libère une heure par jour"],
   modules:[
     {t:'Prendre Copilot en main', l:[
       ["C'est quoi Copilot, et sa particularité",'8 min',
`Copilot est l'assistant IA de Microsoft, **intégré directement dans les outils que beaucoup d'entreprises utilisent déjà** : Word, Excel, Outlook, PowerPoint et Teams.

Sa grande force n'est pas d'être « à part » dans un site web, mais d'être **là où tu travailles**. Dans Word, il rédige ; dans Outlook, il t'aide à répondre ; dans Excel, il analyse ; dans PowerPoint, il crée des diapositives ; dans Teams, il résume tes réunions.

Tu n'as pas à copier-coller d'un outil à l'autre : l'IA agit dans ton document.

À toi de jouer : repère lesquels de ces outils (Word, Excel, Outlook, PowerPoint, Teams) tu utilises déjà au travail.`,null],
       ["Y accéder : une version professionnelle",'8 min',

Il existe aussi un Copilot grand public (dans le navigateur Edge et sur copilot.microsoft.com) pour discuter et rédiger, mais l'intégration dans Word/Excel/Outlook nécessite la licence Microsoft 365 Copilot. Vérifie auprès de ton service informatique si tu y as accès. Si oui, tu verras un **bouton Copilot** dans le ruban de tes applications.

À toi de jouer : demande à ton service informatique (ou vérifie dans une appli Office) si le bouton Copilot est disponible pour toi.`,null],
       ["Où le trouver dans chaque application",'7 min',
`Le principe est constant : cherche l'**icône Copilot** dans le ruban ou sur le côté.

Dans Word, elle apparaît dans la marge pour proposer de rédiger. Dans Outlook, un bouton « Copilot » au-dessus d'un e-mail propose de résumer ou de répondre. Dans Excel, il ouvre un panneau pour analyser ton tableau. Dans PowerPoint et Teams, même logique.

Une fois cette icône repérée, tu sais l'utiliser partout : tu lui écris ta demande en langage normal.

À toi de jouer : ouvre une application Office et retrouve l'icône Copilot.`,null],
       ["Ta première demande utile",'7 min',
`Choisis la tâche la plus fréquente. Dans Word : « Rédige un premier jet de note de service sur le nouveau règlement des congés. » Dans Outlook : ouvre un e-mail reçu et clique « Résumer ».

Le résultat est un brouillon que tu ajustes. L'énorme avantage : tu restes dans ton document, sans copier-coller. Tu diriges, Copilot exécute là où tu es.

À toi de jouer : dans l'outil que tu utilises le plus, fais faire une première tâche simple à Copilot.`,null],
     ]},
     {t:'Bien demander : la compétence clé', l:[
       ["La recette d'une bonne consigne",'9 min',
`Même dans Copilot, la qualité vient de ta demande : **tâche + contexte + format**.

« Rédige un e-mail (tâche) pour informer les clients d'une fermeture exceptionnelle vendredi (contexte), court et rassurant (format). »

Copilot a un avantage : il **connaît le contexte de tes documents et e-mails** (avec ton autorisation), donc tu peux dire « réponds à ce message » ou « résume ce document » sans tout recopier. Reste précis sur ce que tu veux obtenir.

À toi de jouer : formule une demande claire (tâche, contexte, format) pour un e-mail réel dans Outlook.`,null],
       ["Reformuler, raccourcir, changer de ton",'8 min',
`Dans Word et Outlook, sélectionne un texte et demande à Copilot de le **reformuler**, le **raccourcir**, le **rendre plus formel** ou **plus simple**.

Exemple : « Reformule ce paragraphe en langage plus clair et plus court. » C'est idéal pour améliorer un texte existant sans repartir de zéro. Tu gardes le contrôle : Copilot propose, tu acceptes ou tu ajustes.

À toi de jouer : prends un paragraphe existant et demande une version plus courte et plus simple.`,null],
       ["Itérer et vérifier avant d'accepter",'7 min',
`Copilot propose souvent un texte que tu peux **insérer, régénérer ou modifier**. Ne clique pas « insérer » machinalement : relis, demande « une autre version » si besoin, ou précise ta demande.

Comme toute IA, il produit un brouillon de qualité, pas une vérité finale. Le bon réflexe : générer, relire, ajuster, puis valider.

À toi de jouer : génère un texte, demande une variante, et choisis la meilleure avant d'insérer.`,null],
     ]},
     {t:'Cas d\'usage réels au travail', l:[
       ["Word : rédiger et mettre en forme",'9 min',
`Dans Word, Copilot part d'une consigne et écrit un premier jet complet : note de service, compte rendu, procédure, lettre. Donne le sujet, le public et la longueur.

Ensuite, sélectionne des passages pour les reformuler, ajouter une section, ou résumer un long document en haut de page. Tu passes de la page blanche à un brouillon structuré en une minute, puis tu peaufines.

À toi de jouer : fais rédiger dans Word une note dont tu as besoin, puis demande d'ajouter une section de conclusion.`,null],
       ["Outlook : trier et répondre aux e-mails",'9 min',
`Outlook est le gain de temps le plus immédiat.

Copilot **résume** un long fil de discussion (« Résume cette conversation et dis-moi ce qu'on attend de moi »), puis **rédige une réponse** selon ton intention (« Réponds que j'accepte, mais propose lundi »). Pour une boîte pleine, il aide à repérer l'essentiel.

À toi de jouer : sur un long fil d'e-mails, demande un résumé puis fais rédiger une réponse courte.`,null],
       ["Excel : analyser des données, créer des tableaux",'10 min',
`Dans Excel, Copilot t'aide à **comprendre tes données** sans être expert en formules.

Sur un tableau de ventes, demande « Quelles sont les 3 tendances principales ? », « Ajoute une colonne qui calcule la marge », « Crée un tableau récapitulatif par mois » ou « Fais un graphique des ventes par région ». Il propose des formules et des analyses que tu valides.

C'est l'occasion de tirer de la valeur de tableaux que tu n'avais pas le temps d'exploiter.

À toi de jouer : sur un tableau de chiffres, demande à Copilot les grandes tendances et un récapitulatif mensuel.`,null],
       ["PowerPoint et Teams : présentations et réunions",'9 min',
`Dans **PowerPoint**, Copilot peut générer une première présentation à partir d'un sujet ou d'un document Word (« Crée une présentation de 8 diapositives à partir de ce rapport »). Tu obtiens une trame visuelle à ajuster.

À toi de jouer : à ta prochaine réunion Teams (ou depuis un compte rendu), demande le résumé avec les actions et les responsables.`,null],
     ]},
     {t:'Fiable et responsable', l:[
       ["Vérifier avant d'envoyer",'8 min',
`Copilot travaille à partir de tes documents et e-mails, ce qui le rend souvent pertinent — mais il peut mal interpréter ou inventer un détail.

Vérifie toujours les **chiffres d'Excel**, les **faits d'une note** et le **sens d'une réponse** avant de valider. Rien ne part en ton nom sans ta relecture. L'IA accélère ; la responsabilité reste humaine.

À toi de jouer : après une analyse Excel, revérifie manuellement un des chiffres proposés.`,null],
       ["Confidentialité et périmètre professionnel",'9 min',
`Un point rassurant : dans la version professionnelle Microsoft 365, Copilot travaille dans le périmètre de ton organisation et respecte les permissions de tes fichiers.

Cela ne dispense pas de prudence : n'utilise pas Copilot pour extraire ou diffuser des données auxquelles tu n'as pas droit, et suis les consignes de ton service informatique. Ne colle pas d'informations sensibles dans une version grand public non gérée par ton entreprise.

À toi de jouer : note la différence entre le Copilot pro de ton entreprise et un Copilot grand public, et lequel tu dois utiliser pour le travail.`,null],
       ["Bonnes habitudes pour durer",'8 min',
`Commence par **un** outil (souvent Outlook ou Word), prends le réflexe de cliquer sur Copilot pour résumer et rédiger, relis toujours, et étends peu à peu aux autres applications. Garde tes meilleures consignes pour les réutiliser.

Vérifie aussi s'il existe une consigne interne sur l'usage de Copilot chez toi, et respecte-la — pour tout document officiel, la relecture humaine est la norme.

Objectif de la semaine : gagner 30 minutes par jour sur tes e-mails grâce au résumé et à la réponse assistée.

À toi de jouer : choisis un outil et une tâche quotidienne, et utilise Copilot dessus tous les jours cette semaine.`,null],
     ]},
     {t:'Ta boîte à outils (à copier-coller)', l:[
       ["Les consignes qui marchent, application par application",'12 min',
`Ta bibliothèque de départ, organisée par application. Copie-la dans ton téléphone, remplace les [crochets], et utilise chaque consigne directement dans l'application concernée.

**Outlook — résumer** : « Résume cette conversation : qu'est-ce qui a été décidé, et qu'attend-on de moi ? » **Outlook — répondre** : « Rédige une réponse qui [accepte / refuse / propose une autre date], ton courtois, 5 lignes maximum. »

**Word — premier jet** : « Rédige un premier jet de [note de service / procédure / lettre] sur [sujet], pour [public], une demi-page, ton clair. » **Word — améliorer** : sélectionne un passage + « Reformule en plus court et plus simple, sans changer le sens. » **Word — résumer** : « Résume ce document en 5 points pour quelqu'un qui ne l'a pas lu. »

**Excel — comprendre** : « Quelles sont les 3 tendances principales de ce tableau ? » **Excel — calculer** : « Ajoute une colonne qui calcule [la marge / l'écart / le total] et explique la formule utilisée. » **Excel — synthétiser** : « Crée un tableau récapitulatif par [mois / région / produit] avec un graphique adapté. »

**PowerPoint — créer** : « Crée une présentation de [8] diapositives à partir de [ce document Word / ce sujet], style sobre, un message clé par diapositive. »

**Teams — rattraper** : « Résume cette réunion : décisions, actions et responsables, points en suspens. » (Fonctionne même si tu es arrivé en retard.)

À toi de jouer : copie ces consignes maintenant, et utilise aujourd'hui celle de l'application que tu ouvres le plus.`,null],
       ["Ta routine quotidienne : matin, midi, fin de journée",'10 min',
`Le vrai gain avec Copilot ne vient pas d'un exploit ponctuel, mais d'une routine simple répétée chaque jour. En voici une qui a fait ses preuves — adapte-la à ton poste.

**Le matin (10 min)** : ouvre Outlook, demande le résumé des longs fils arrivés depuis hier ; fais rédiger les 2-3 réponses simples ; relis, ajuste, envoie. Ta boîte est sous contrôle avant même ton premier café fini.

**Après chaque réunion Teams (3 min)** : demande le résumé avec décisions et actions ; colle-le dans un e-mail « suivi de réunion » à l'équipe. C'est toi qui envoies le compte rendu en premier — effet professionnel garanti.

**Avant un document (5 min)** : au lieu de partir de zéro dans Word, demande le premier jet avec sujet, public et longueur. Ton travail devient : améliorer, pas créer.

**Le vendredi (10 min)** : dans Excel, demande les tendances de tes chiffres de la semaine ; note les 3 points pour ton point hebdo.

Cette routine prend 25 minutes par jour et en libère facilement une heure. La condition : la faire tous les jours pendant une semaine, jusqu'à ce qu'elle devienne automatique.

À toi de jouer : choisis les 2 moments de la routine les plus utiles pour TON poste et mets un rappel dans ton téléphone pour demain matin.`,null],
       ["Ton plan d'action : 7 jours pour en faire un réflexe",'10 min',
`Une semaine pour installer Copilot dans ton quotidien, application par application.

**Jour 1** : Outlook uniquement — résume 3 fils, fais rédiger 2 réponses. Note le temps gagné. **Jour 2** : ajoute Word — un premier jet réel (note, courrier, procédure). **Jour 3** : Teams — résume ta réunion du jour (ou un enregistrement récent) et envoie le suivi. **Jour 4** : Excel — tendances et récapitulatif sur un vrai tableau. Vérifie un chiffre à la main pour prendre le réflexe. **Jour 5** : PowerPoint — génère une trame de présentation à partir d'un document existant. **Jours 6-7** : bilan — quelles applications t'ont fait gagner le plus ? Installe la routine quotidienne (leçon précédente) sur ces 2-3 moments-là.

**Si tu n'as pas encore la licence** : utilise cette semaine pour la demander. Montre à ton responsable la liste de ce que tu comptes automatiser (résumés Outlook, comptes rendus Teams, premiers jets Word) — c'est un argument concret, chiffrable en heures gagnées.

**Ensuite** : garde le réflexe « Copilot d'abord » sur chaque tâche répétitive dans Office, et continue d'enrichir ta liste de consignes gagnantes.

À toi de jouer : planifie les 5 premiers jours dans ton agenda dès maintenant, et viens raconter ton jour 1 dans la communauté (Victoires).`,null],
     ]},
   ]},

  /* ---------- GRATUIT · Anglais ---------- */
  {id:'en', title:'Anglais : bien démarrer (les vraies bases)', cat:'Anglais', price:0, g:2,
   instr:'Équipe Boyia Institute', instrRole:"Cours d'anglais — les vraies bases", dur:'~1 h 15',
   desc:"Les bases pour comprendre et te faire comprendre : te présenter, les mots essentiels, les phrases de tous les jours. Avec une grande leçon vidéo et des fiches simples.",
   learn:["Te présenter en anglais avec assurance","Retenir les mots les plus utiles du quotidien","Poser une question polie et comprendre la réponse","Écrire un message simple et correct"],
   modules:[
     {t:'Se présenter', l:[
       ["Hello ! Te présenter en 6 phrases",'8 min',
`Apprends ces six phrases par cœur — elles couvrent 90 % des présentations :

**Hello, my name is Awa.** (Bonjour, je m'appelle Awa.) **I'm from Côte d'Ivoire.** (Je viens de Côte d'Ivoire.) **I live in Abidjan.** (J'habite à Abidjan.) **I work in a shop.** / **I'm a student.** (Je travaille dans une boutique. / Je suis étudiant·e.) **Nice to meet you!** (Enchanté·e !) **And you?** (Et toi ?)

Prononciation : ne cherche pas la perfection, cherche à être compris. Parle lentement et articule. « Nice to meet you » se dit à peu près « naïss tou mit you ».

À toi de jouer : enregistre-toi sur ton téléphone en te présentant avec ces 6 phrases, puis réécoute. Fais-le 3 jours de suite : tu verras la différence.`,null],
       ["Dire ce que tu fais dans la vie",'7 min',
`Pour parler de ton activité, une structure suffit : **I'm a…** (je suis…) ou **I work in / as…** (je travaille dans / comme…).

**I'm a seller.** (Je suis vendeur·se.) **I'm a driver.** (chauffeur) **I'm a hairdresser.** (coiffeur·se) **I'm a teacher.** (enseignant·e) **I work in a restaurant.** (Je travaille dans un restaurant.) **I have a small business.** (J'ai un petit commerce.) **I'm looking for a job.** (Je cherche du travail.)

Ajoute une phrase sur ce que tu vends ou fais : **I sell shoes.** (Je vends des chaussures.) **I make dresses.** (Je fais des robes.)

À toi de jouer : écris 2 phrases sur ton activité (ou celle que tu vises) et dis-les à voix haute jusqu'à les dire sans lire.`,null],
     ]},
     {t:'Le vocabulaire de survie', l:[
       ["Grande leçon vidéo : le vocabulaire de base",'60 min',
`Cette leçon vidéo intensive couvre le vocabulaire de base pour débutant, en français. Elle est longue : ne la regarde pas d'un coup !

**La bonne méthode** : 10 à 15 minutes par jour, en répétant chaque mot à voix haute après la vidéo. Mets sur pause, répète, avance. Ton oreille et ta bouche apprennent en même temps.

Reviens marquer cette leçon comme terminée quand tu as fini la vidéo — même si cela te prend une semaine. C'est le rythme normal.

À toi de jouer : chaque jour, note 5 mots de la vidéo dans ton téléphone et utilise-les dans une phrase.`,'fDxP2m6qvH4'],
       ["Les 20 phrases de tous les jours",'8 min',
`Ces phrases reviennent sans arrêt. Apprends-en 4 par jour pendant 5 jours :

**Thank you (very much).** Merci (beaucoup). **You're welcome.** De rien. **Please.** S'il te plaît. **Excuse me.** Excusez-moi. **I'm sorry.** Pardon. **Yes / No / Maybe.** Oui / Non / Peut-être. **I don't understand.** Je ne comprends pas. **Can you repeat, please?** Tu peux répéter ? **Slowly, please.** Doucement, s'il te plaît. **How much is it?** C'est combien ? **Where is…?** Où est… ? **What time is it?** Quelle heure est-il ? **I would like…** Je voudrais… **Of course.** Bien sûr. **No problem.** Pas de problème. **See you later!** À plus tard ! **Have a nice day!** Bonne journée ! **I don't know.** Je ne sais pas. **Can you help me?** Tu peux m'aider ? **It's okay.** Ça va.

À toi de jouer : choisis les 5 phrases qui te serviront le plus et utilise-les aujourd'hui, même seul·e à voix haute.`,null],
     ]},
     {t:'Communiquer vraiment', l:[
       ["Poser une question polie",'8 min',
`La politesse anglaise tient en deux formules magiques : **Can you…?** (Tu peux… ?) et **Could you…, please?** (Pourriez-vous…, s'il vous plaît ? — plus poli).

**Can you help me, please?** (Tu peux m'aider ?) **Could you repeat, please?** (Pourriez-vous répéter ?) **Can I pay with mobile money?** (Je peux payer par mobile money ?) **Could you send me the price?** (Pourriez-vous m'envoyer le prix ?)

Pour comprendre la réponse, guette les mots clés : **yes / no / sure** (bien sûr) / **sorry** (désolé) / **later** (plus tard) / **tomorrow** (demain).

À toi de jouer : écris 3 questions « Can you… ? » utiles dans TA vie (travail, marché, téléphone) et répète-les.`,null],
       ["Écrire un message simple (WhatsApp, e-mail)",'9 min',
`À l'écrit, reste simple : sujet + verbe + complément. Personne ne te reprochera des phrases courtes.

Message WhatsApp type : **Hello! I saw your product. How much is it? Can you deliver to Abidjan? Thank you!** (Bonjour ! J'ai vu votre produit. C'est combien ? Vous livrez à Abidjan ? Merci !)

Début d'e-mail : **Hello Mr. Smith, / Dear Madam,** — Fin : **Best regards, Awa** (Cordialement).

Trois erreurs à éviter : n'écris pas tout en majuscules (impoli), n'oublie pas **please** et **thank you**, et relis avant d'envoyer (ou fais corriger par une IA — voir nos cours IA !).

À toi de jouer : écris un message de 3 phrases en anglais pour demander le prix d'un produit, comme si tu l'envoyais vraiment.`,null],
       ["Ton plan des 30 prochains jours",'6 min',
`La langue s'apprend par petites doses répétées, pas en une fois. Voici un plan simple et tenable :

**Chaque jour (15 min)** : 5 mots de vocabulaire + 2 phrases de la leçon « tous les jours » + te présenter à voix haute une fois. **Chaque semaine** : écris un message en anglais (leçon précédente) et écoute 10 minutes d'anglais (une chanson dont tu lis les paroles, une vidéo simple). **Dans la communauté** : poste une phrase en anglais par semaine dans Entraide — on te corrige avec bienveillance !

Dans 30 jours, tu sauras te présenter, demander un prix, remercier et écrire un message simple. C'est une vraie base — et c'est plus que la majorité des gens.

À toi de jouer : mets un rappel quotidien de 15 minutes dans ton téléphone, intitulé « My English time ». Commence demain matin.`,null],
     ]},
   ]},
];

   perdu leur « 0 » de tête. En Côte d'Ivoire (+225), les numéros font 10 chiffres et

const fcfa = n => n===0 ? 'Gratuit' : n.toLocaleString('fr-FR').replace(/ /g,' ')+' FCFA';

/* Numéro WhatsApp au format international : indicatif + numéro local (avec le 0 conservé).
   Ex. +225 + 0576020058 -> +2250576020058. */
function waFull(u){ if(!u) return ''; const p=(u.prefix||'+225'); const n=String(u.whatsapp||'').replace(/\D/g,''); return p+n; }
function ago(t){
  const s = Math.max(1,(Date.now()-t)/1000);
  if(s<60) return 'à l\'instant';
  if(s<3600) return `il y a ${Math.floor(s/60)} min`;
  if(s<86400) return `il y a ${Math.floor(s/3600)} h`;
  if(s<7*86400) return `il y a ${Math.floor(s/86400)} j`;
  return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}
let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2400);
